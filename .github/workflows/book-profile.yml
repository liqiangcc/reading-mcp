name: Book profile
on:
  workflow_dispatch:
  push:
    branches: ['bench/**']
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install heaptrack
        run: sudo apt-get update && sudo apt-get install -y heaptrack
      - name: Build release binary with line tables
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release --locked --bin reading-mcp
      - name: Download public-domain books
        run: |
          BOOKS="$RUNNER_TEMP/books"
          mkdir -p "$BOOKS"
          download() {
            local url="$1" out="$2"
            if curl -fsSL --retry 3 -o "$out" "$url"; then
              echo "$out: $(stat -c%s "$out") bytes sha256=$(sha256sum "$out" | cut -d' ' -f1)"
            else
              echo "::warning::failed to download $url"
              rm -f "$out"
            fi
            return 0
          }
          download "https://www.gutenberg.org/cache/epub/24264/pg24264-images.epub" "$BOOKS/zh-classic.epub"
          download "https://www.gutenberg.org/cache/epub/2600/pg2600-images.epub" "$BOOKS/en-novel.epub"
          download "https://www.gutenberg.org/cache/epub/24183/pg24183-images.epub" "$BOOKS/zh-large.epub"
      - name: Unit text equals range slice (real books)
        if: always()
        run: READING_MCP_SLICE_CHECK_DIR="$RUNNER_TEMP/books" cargo test --release --locked --test unit_text_slices -- --ignored --nocapture
      - name: Profile book scenarios
        run: |
          BOOKS="$RUNNER_TEMP/books"
          mkdir -p book
          docs=""
          for pair in "zh-classic=$BOOKS/zh-classic.epub" "en-novel=$BOOKS/en-novel.epub" "zh-large=$BOOKS/zh-large.epub"; do
            label="${pair%%=*}"
            file="${pair#*=}"
            if [ -f "$file" ]; then
              docs="${docs:+$docs,}$label=$file"
            fi
          done
          args=(--binary target/release/reading-mcp --states dir --sizes-mb 4
            --cjk-sizes-mb 1,4 --markdown-sections 2000 --reopen --telemetry --disk
            --parse-timeout-seconds 900 --run-timeout-seconds 900 --out book/runs.json
            --probe-query "en-novel=Pierre" --probe-query "zh-classic=寶玉"
            --probe-query "zh-large=皇帝")
          if [ -n "$docs" ]; then
            args+=(--documents "$docs")
          fi
          python3 scripts/memory-profile.py "${args[@]}"
      - name: Sequential reading probe
        if: always()
        run: |
          BOOKS="$RUNNER_TEMP/books"
          mkdir -p book
          docs=""
          for pair in "en-novel=$BOOKS/en-novel.epub" "zh-classic=$BOOKS/zh-classic.epub" "zh-large=$BOOKS/zh-large.epub"; do
            label="${pair%%=*}"
            file="${pair#*=}"
            if [ -f "$file" ]; then
              docs="${docs:+$docs,}$label=$file"
            fi
          done
          args=(--binary target/release/reading-mcp --documents "$docs"
            --out book/sequential.json)
          python3 scripts/sequential-read-probe.py "${args[@]}"
      - name: Profile the largest inputs with heaptrack
        if: always()
        run: |
          BOOKS="$RUNNER_TEMP/books"
          mkdir -p book
          args=(--binary target/release/reading-mcp --states dir --markdown-sections 2000
            --cjk-sizes-mb 4
            --parse-timeout-seconds 900 --run-timeout-seconds 900
            --wrapper "heaptrack -o book/{label}" --out book/runs-heap.json)
          docs=""
          for pair in "zh-classic=$BOOKS/zh-classic.epub" "en-novel=$BOOKS/en-novel.epub"; do
            label="${pair%%=*}"
            file="${pair#*=}"
            if [ -f "$file" ]; then
              docs="${docs:+$docs,}$label=$file"
            fi
          done
          if [ -n "$docs" ]; then
            args+=(--documents "$docs")
          fi
          python3 scripts/memory-profile.py "${args[@]}"
      - name: Summarize heap profiles
        if: always()
        run: |
          for f in book/*.zst; do
            [ -e "$f" ] || continue
            echo "=== $f"
            heaptrack_print --file "$f" --print-peaks=1 --peak-limit=25 --sub-peak-limit=4 \
              --print-allocators=0 --print-temporary=0 --print-leaks=0 --print-histogram=0 \
              > "$f.peaks.txt"
            head -200 "$f.peaks.txt"
            tail -5 "$f.peaks.txt"
          done
      - name: Upload book data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-profile
          path: book/
