name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        id: format
        run: cargo fmt --all -- --check

      - name: Capture rustfmt patch
        if: failure() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch

      - name: Upload rustfmt patch
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy log
        if: failure() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: error
          retention-days: 1

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee test.log

      - name: Upload test log
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: error
          retention-days: 1

      - name: Package protocol smoke test
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('Cargo.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit('could not read package version')
          print(match.group(1))
          PY
          )
          release_sha=$(git rev-parse HEAD)
          REPO_DIR="$GITHUB_WORKSPACE" \
          RELEASE_VERSION="$version" \
          RELEASE_TAG="v$version" \
          RELEASE_SHA="$release_sha" \
          VERIFY_RELEASE_TAG=false \
          TARGET_TRIPLE=x86_64-unknown-linux-gnu \
          PLATFORM=linux-x86_64 \
          OUTPUT_DIR="$RUNNER_TEMP/package-smoke" \
          PACKAGING_COMMIT_SHA="$release_sha" \
          bash scripts/package-release.sh
