name: Issue 69 apply chunk patch once

on:
  push:
    branches:
      - feat/issue-69-named-section-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-69-named-section-boundary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check issue69-chunk-structure.patch
          git apply issue69-chunk-structure.patch
          cargo fmt --all

      - name: Validate candidate with diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo clippy --all-targets --all-features -- -D warnings > /tmp/clippy.log 2>&1
          clippy_status=$?
          cargo test --locked > /tmp/test.log 2>&1
          test_status=$?

          raft="$RUNNER_TEMP/atc14-paper-ongaro.pdf"
          kafka="$RUNNER_TEMP/kafka-2011-paper.pdf"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 60 \
            "https://www.usenix.org/system/files/conference/atc14/atc14-paper-ongaro.pdf" \
            --output "$raft" > /tmp/raft-curl.log 2>&1
          raft_curl_status=$?
          curl --fail --location --retry 3 --retry-delay 2 --max-time 60 \
            "https://www.microsoft.com/en-us/research/wp-content/uploads/2017/09/Kafka.pdf" \
            --output "$kafka" > /tmp/kafka-curl.log 2>&1
          kafka_curl_status=$?

          real_status=125
          if [ "$raft_curl_status" -eq 0 ] && [ "$kafka_curl_status" -eq 0 ]; then
            READING_MCP_RAFT_EVIDENCE_PDF="$raft" \
            READING_MCP_KAFKA_EVIDENCE_PDF="$kafka" \
              cargo test --locked --test raft_named_section_evidence -- --ignored --nocapture \
              > /tmp/real.log 2>&1
            real_status=$?
          else
            : > /tmp/real.log
          fi

          {
            echo "fmt_status=$fmt_status"
            echo "clippy_status=$clippy_status"
            echo "test_status=$test_status"
            echo "raft_curl_status=$raft_curl_status"
            echo "kafka_curl_status=$kafka_curl_status"
            echo "real_status=$real_status"
            echo
            echo "=== CLIPPY tail ==="
            tail -n 120 /tmp/clippy.log
            echo
            echo "=== TEST tail ==="
            tail -n 160 /tmp/test.log
            echo
            echo "=== REAL-SOURCE tail ==="
            tail -n 200 /tmp/real.log
          } > issue69-apply-diagnostic.txt

          if [ "$fmt_status" -ne 0 ] || [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ] \
             || [ "$raft_curl_status" -ne 0 ] || [ "$kafka_curl_status" -ne 0 ] || [ "$real_status" -ne 0 ]; then
            exit 1
          fi

      - name: Commit diagnostic on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f issue69-apply-diagnostic.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue69-apply-diagnostic.txt
          git commit -m "ci: record issue69 chunk validation diagnostic"
          git push origin HEAD:feat/issue-69-named-section-boundary

      - name: Commit validated product changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parsing/pdf.rs tests/pdf_heading_inference.rs
          git commit -m "feat: infer PDF headings from structural chunks"
          git push origin HEAD:feat/issue-69-named-section-boundary
