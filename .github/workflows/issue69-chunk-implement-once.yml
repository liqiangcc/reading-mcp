name: Issue 69 chunk implementation once

on:
  push:
    branches:
      - feat/issue-69-named-section-boundary

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-69-named-section-boundary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply chunk-stream PDF structure patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/parsing/pdf.rs")
          text = path.read_text()
          text = text.replace(
              'const PDF_HEADING_INFERENCE_VERSION: &str = "pdf-numbered-heading-inference/v1";',
              'const PDF_HEADING_INFERENCE_VERSION: &str = "pdf-numbered-heading-inference/v2";',
          )
          old_page = '''struct PageText {
              number: u32,
              text: String,
          }'''
          new_page = '''struct PageText {
              number: u32,
              text: String,
              chunks: Vec<String>,
          }'''
          if old_page not in text:
              raise SystemExit("PageText block not found")
          text = text.replace(old_page, new_page)

          old_candidate = '''struct PdfHeadingCandidate {
              number_path: Vec<u32>,
              title: String,
              page: u32,
              global_line: usize,
          }

          #[derive(Clone, Debug)]
          struct PdfSourceLine {
              page: u32,
              global_line: usize,
              text: String,
          }'''
          new_candidate = '''struct PdfHeadingCandidate {
              number_path: Vec<u32>,
              title: String,
              page: u32,
              global_fragment: usize,
          }

          #[derive(Clone, Debug)]
          struct PdfSourceFragment {
              page: u32,
              global_fragment: usize,
              text: String,
          }'''
          if old_candidate not in text:
              raise SystemExit("heading candidate block not found")
          text = text.replace(old_candidate, new_candidate)

          old_extract = '''fn extract_page_texts(pdf: &LopdfDocument, page_numbers: &[u32]) -> (Vec<PageText>, Vec<String>) {
              let mut pages = Vec::with_capacity(page_numbers.len());
              let mut errors = Vec::new();

              for page_number in page_numbers {
                  match pdf.extract_text_with_limit(&[*page_number], MAX_PAGE_DECOMPRESSED_BYTES) {
                      Ok(text) => pages.push(PageText {
                          number: *page_number,
                          text: normalize_pdf_text(&text),
                      }),
                      Err(error) => {
                          errors.push(format!("page {page_number}: {error}"));
                          pages.push(PageText {
                              number: *page_number,
                              text: String::new(),
                          });
                      }
                  }
              }

              (pages, errors)
          }
          '''
          new_extract = '''fn extract_page_texts(pdf: &LopdfDocument, page_numbers: &[u32]) -> (Vec<PageText>, Vec<String>) {
              let mut pages = Vec::with_capacity(page_numbers.len());
              let mut errors = Vec::new();

              for page_number in page_numbers {
                  let chunks = pdf
                      .extract_text_chunks_with_limit(&[*page_number], MAX_PAGE_DECOMPRESSED_BYTES)
                      .into_iter()
                      .filter_map(Result::ok)
                      .map(|chunk| normalize_pdf_text(&chunk))
                      .filter(|chunk| !chunk.is_empty())
                      .collect::<Vec<_>>();
                  match pdf.extract_text_with_limit(&[*page_number], MAX_PAGE_DECOMPRESSED_BYTES) {
                      Ok(text) => pages.push(PageText {
                          number: *page_number,
                          text: normalize_pdf_text(&text),
                          chunks,
                      }),
                      Err(error) => {
                          errors.push(format!("page {page_number}: {error}"));
                          pages.push(PageText {
                              number: *page_number,
                              text: String::new(),
                              chunks,
                          });
                      }
                  }
              }

              (pages, errors)
          }
          '''
          if old_extract not in text:
              raise SystemExit("extract_page_texts block not found")
          text = text.replace(old_extract, new_extract)

          start = text.index("fn infer_numbered_headings(")
          end = text.index("fn content_and_bindings_from_fragments(")
          replacement = r'''fn infer_numbered_headings(pages: &[PageText]) -> Option<Vec<PdfHeadingCandidate>> {
              let fragments = source_fragments(pages);
              let parsed = fragments
                  .iter()
                  .filter_map(|fragment| {
                      parse_numbered_heading(&fragment.text).map(|(number_path, title)| PdfHeadingCandidate {
                          number_path,
                          title,
                          page: fragment.page,
                          global_fragment: fragment.global_fragment,
                      })
                  })
                  .collect::<Vec<_>>();

              let mut accepted = Vec::new();
              let mut expected_top = 1_u32;
              let mut current_top = None;
              let mut expected_child = HashMap::<Vec<u32>, u32>::new();

              for candidate in parsed {
                  let top = candidate.number_path[0];
                  if candidate.number_path.len() == 1 {
                      if top == expected_top && top <= 99 {
                          current_top = Some(top);
                          expected_top = expected_top.saturating_add(1);
                          expected_child.entry(candidate.number_path.clone()).or_insert(1);
                          accepted.push(candidate);
                      }
                      continue;
                  }

                  if current_top != Some(top) || !has_parent_heading(&accepted, &candidate.number_path) {
                      continue;
                  }
                  let parent = candidate.number_path[..candidate.number_path.len() - 1].to_vec();
                  let child = *candidate.number_path.last().unwrap_or(&0);
                  let expected = expected_child.entry(parent).or_insert(1);
                  if child != *expected {
                      continue;
                  }
                  *expected = (*expected).saturating_add(1);
                  expected_child.entry(candidate.number_path.clone()).or_insert(1);
                  accepted.push(candidate);
              }

              let top_level_count = accepted
                  .iter()
                  .filter(|candidate| candidate.number_path.len() == 1)
                  .count();
              (top_level_count >= 2).then_some(accepted)
          }

          fn source_fragments(pages: &[PageText]) -> Vec<PdfSourceFragment> {
              let mut fragments = Vec::new();
              let mut global_fragment = 0_usize;
              for page in pages {
                  for text in &page.chunks {
                      fragments.push(PdfSourceFragment {
                          page: page.number,
                          global_fragment,
                          text: text.clone(),
                      });
                      global_fragment = global_fragment.saturating_add(1);
                  }
              }
              fragments
          }

          fn parse_numbered_heading(fragment: &str) -> Option<(Vec<u32>, String)> {
              let fragment = fragment.trim();
              if fragment.is_empty()
                  || fragment.contains('\n')
                  || fragment.chars().count() > MAX_INFERRED_HEADING_CHARS
              {
                  return None;
              }

              let mut prefix_end = 0_usize;
              for (index, character) in fragment.char_indices() {
                  if character.is_ascii_digit() || character == '.' {
                      prefix_end = index + character.len_utf8();
                  } else {
                      break;
                  }
              }
              if prefix_end == 0 {
                  return None;
              }

              let raw_number = &fragment[..prefix_end];
              let number = raw_number.trim_end_matches('.');
              let title = fragment[prefix_end..]
                  .trim_start_matches(|character: char| {
                      character.is_whitespace() || matches!(character, '.' | ':' | '-' | '–' | '—')
                  })
                  .trim();
              if number.is_empty()
                  || title.is_empty()
                  || title.split_whitespace().count() > MAX_INFERRED_HEADING_WORDS
                  || !title.chars().any(char::is_alphabetic)
                  || !title.chars().next().is_some_and(char::is_uppercase)
              {
                  return None;
              }

              let number_path = number
                  .split('.')
                  .map(|part| {
                      if part.is_empty()
                          || part.len() > 3
                          || !part.bytes().all(|byte| byte.is_ascii_digit())
                      {
                          return None;
                      }
                      let value = part.parse::<u32>().ok()?;
                      (value > 0).then_some(value)
                  })
                  .collect::<Option<Vec<_>>>()?;
              if number_path.is_empty() || number_path.len() > 6 {
                  return None;
              }
              Some((number_path, format!("{} {}", number, title)))
          }

          fn has_parent_heading(accepted: &[PdfHeadingCandidate], path: &[u32]) -> bool {
              if path.len() <= 1 {
                  return true;
              }
              let parent = &path[..path.len() - 1];
              accepted
                  .iter()
                  .rev()
                  .any(|candidate| candidate.number_path == parent)
          }

          fn build_inferred_heading_sections(
              headings: &[PdfHeadingCandidate],
              pages: &[PageText],
          ) -> (Vec<Section>, Vec<OriginalSourceBinding>) {
              let fragments_source = source_fragments(pages);
              let heading_by_fragment = headings
                  .iter()
                  .enumerate()
                  .map(|(index, heading)| (heading.global_fragment, index))
                  .collect::<HashMap<_, _>>();

              let mut fragments = vec![PageFragments::default(); headings.len()];
              let mut preamble = PageFragments::default();
              let mut current_heading = None;
              for fragment in &fragments_source {
                  if let Some(index) = heading_by_fragment.get(&fragment.global_fragment).copied() {
                      current_heading = Some(index);
                      continue;
                  }
                  match current_heading {
                      Some(index) => fragments[index].push_line(fragment.page, &fragment.text),
                      None => preamble.push_line(fragment.page, &fragment.text),
                  }
              }

              let mut nodes = Vec::<SectionNode>::with_capacity(headings.len());
              let mut id_counts = HashMap::<String, usize>::new();
              for (index, heading) in headings.iter().enumerate() {
                  let parent = if heading.number_path.len() == 1 {
                      None
                  } else {
                      let parent_path = &heading.number_path[..heading.number_path.len() - 1];
                      headings[..index]
                          .iter()
                          .rposition(|candidate| candidate.number_path == parent_path)
                  };
                  let mut path = parent
                      .map(|parent_index| nodes[parent_index].path.clone())
                      .unwrap_or_default();
                  path.push(heading.title.clone());
                  let base_id = format!(
                      "section://{}",
                      path.iter()
                          .map(|segment| slugify(segment))
                          .collect::<Vec<_>>()
                          .join("/")
                  );
                  let count = id_counts.entry(base_id.clone()).or_insert(0);
                  *count += 1;
                  let id = if *count == 1 {
                      base_id
                  } else {
                      format!("{base_id}-{}", *count)
                  };
                  nodes.push(SectionNode {
                      id: SectionId(id),
                      parent,
                      title: heading.title.clone(),
                      level: heading.number_path.len() as u8,
                      start_page: heading.page,
                      content: String::new(),
                      location: Location::default(),
                      path,
                  });
              }

              let mut bindings = Vec::new();
              for (index, section_fragments) in fragments.iter().enumerate() {
                  let (content, section_bindings, end_page) =
                      content_and_bindings_from_fragments(section_fragments, &nodes[index].id);
                  bindings.extend(section_bindings);
                  nodes[index].content = content;
                  nodes[index].location = Location {
                      page: Some(nodes[index].start_page),
                      chapter: nodes[index].path.first().cloned(),
                      section_path: nodes[index].path.clone(),
                      native_location: Some(pdf_page_range_location(nodes[index].start_page, end_page)),
                      ..Location::default()
                  };
              }

              let mut sections = Vec::new();
              let (preamble_content, preamble_bindings, preamble_end_page) =
                  content_and_bindings_from_fragments(&preamble, &SectionId("section://preamble".into()));
              if !preamble_content.trim().is_empty() {
                  let start_page = preamble.0.first().map(|(page, _)| *page).unwrap_or(1);
                  sections.push(Section {
                      id: SectionId("section://preamble".into()),
                      parent_id: None,
                      title: "Preamble".into(),
                      level: 1,
                      content: preamble_content,
                      location: Location {
                          page: Some(start_page),
                          section_path: vec!["Preamble".into()],
                          native_location: Some(pdf_page_range_location(start_page, preamble_end_page)),
                          ..Location::default()
                      },
                      children: Vec::new(),
                  });
                  bindings.extend(preamble_bindings);
              }
              sections.extend(
                  nodes
                      .iter()
                      .enumerate()
                      .filter(|(_, node)| node.parent.is_none())
                      .map(|(index, _)| build_section(index, &nodes)),
              );
              (sections, bindings)
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          test_path = Path("tests/pdf_heading_inference.rs")
          test = test_path.read_text()
          test = test.replace(
              '''                "1 Introduction",
                          "Introduction body sentinel.",
                          "1.1 Scope",
                          "Scope body sentinel.",''',
              '''                "1Introduction",
                          "Introduction body sentinel.",
                          "1.2 indicates where details are discussed.",
                          "1.1Scope",
                          "Scope body sentinel.",''',
          )
          test = test.replace(
              '&["2 Replication", "Future body sentinel."]',
              '&["2Replication", "Future body sentinel."]',
          )
          test = test.replace(
              'Some("pdf-numbered-heading-inference/v1")',
              'Some("pdf-numbered-heading-inference/v2")',
          )
          old_assert = '''    assert!(introduction.content.contains("Introduction body sentinel"));
          assert!(!introduction.content.contains("1 Introduction"));'''
          new_assert = '''    assert!(introduction.content.contains("Introduction body sentinel"));
          assert!(
              introduction
                  .content
                  .contains("1.2 indicates where details are discussed.")
          );
          assert!(!introduction.content.contains("1Introduction"));'''
          if old_assert not in test:
              raise SystemExit("synthetic heading assertion block not found")
          test = test.replace(old_assert, new_assert)
          test_path.write_text(test)
          PY

          cargo fmt --all

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked
          raft="$RUNNER_TEMP/atc14-paper-ongaro.pdf"
          kafka="$RUNNER_TEMP/kafka-2011-paper.pdf"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 60 \
            "https://www.usenix.org/system/files/conference/atc14/atc14-paper-ongaro.pdf" \
            --output "$raft"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 60 \
            "https://www.microsoft.com/en-us/research/wp-content/uploads/2017/09/Kafka.pdf" \
            --output "$kafka"
          READING_MCP_RAFT_EVIDENCE_PDF="$raft" \
          READING_MCP_KAFKA_EVIDENCE_PDF="$kafka" \
            cargo test --locked --test raft_named_section_evidence -- --ignored --nocapture

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parsing/pdf.rs tests/pdf_heading_inference.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: infer PDF headings from structural chunks"
          git push origin HEAD:feat/issue-69-named-section-boundary
