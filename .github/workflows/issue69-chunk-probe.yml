name: Issue 69 Raft chunk probe

on:
  push:
    branches:
      - feat/issue-69-named-section-boundary

permissions:
  contents: write

jobs:
  probe-raft-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-69-named-section-boundary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Probe structural chunks
        shell: bash
        run: |
          set -euo pipefail
          raft="$RUNNER_TEMP/atc14-paper-ongaro.pdf"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 60 \
            "https://www.usenix.org/system/files/conference/atc14/atc14-paper-ongaro.pdf" \
            --output "$raft"
          READING_MCP_RAFT_EVIDENCE_PDF="$raft" \
            cargo test --locked --test raft_heading_shape_diagnostic -- --ignored --nocapture \
            > /tmp/issue69-raft-chunk.log 2>&1
          grep -E 'CHUNK_CANDIDATE|CHUNK_SHAPE' /tmp/issue69-raft-chunk.log \
            > issue69-raft-chunk-probe.txt || true

      - name: Commit chunk probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue69-raft-chunk-probe.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record issue69 Raft chunk probe"
          git push origin HEAD:feat/issue-69-named-section-boundary
