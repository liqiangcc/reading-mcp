name: Issue 69 normalize once

on:
  push:
    branches:
      - feat/issue-69-named-section-boundary

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-69-named-section-boundary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Narrow punctuation normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/application/get_document_structure.rs")
          text = path.read_text(encoding="utf-8")
          start = text.index("fn normalize_heading_key(value: &str) -> String {")
          end = text.index("\n\nfn strip_section_prefix", start)
          new = "fn normalize_heading_key(value: &str) -> String {\n    let parts = value.split_whitespace().collect::<Vec<_>>();\n    if parts.is_empty() {\n        return String::new();\n    }\n    let numeric_index = usize::from(parts[0].eq_ignore_ascii_case(\"section\"));\n    let mut normalized = Vec::with_capacity(parts.len());\n    for (index, part) in parts.into_iter().enumerate() {\n        if index == numeric_index {\n            normalized.push(part.trim_end_matches(&['.', ':', '-', '–', '—'][..]));\n        } else if index == numeric_index.saturating_add(1)\n            && matches!(part, \"-\" | \"–\" | \"—\" | \":\")\n        {\n            continue;\n        } else {\n            normalized.push(part);\n        }\n    }\n    normalized.join(\" \")\n}"
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")

          test = Path("tests/named_section_boundary.rs")
          text = test.read_text(encoding="utf-8")
          if "number_separator_is_normalized_but_title_hyphen_is_not_fuzzy" not in text:
              marker = "fn command_for(\n"
              addition = "#[tokio::test]\nasync fn number_separator_is_normalized_but_title_hyphen_is_not_fuzzy() {\n    let document = Document {\n        id: DocumentId(\"doc:punctuation\".into()),\n        source: DocumentSource(\"memory:punctuation.md\".into()),\n        title: \"Punctuation\".into(),\n        media_type: MediaType(\"text/markdown\".into()),\n        content_hash: ContentHash(\"sha256:punctuation\".into()),\n        metadata: Default::default(),\n        root_sections: vec![\n            section(\"section://state-machine\", \"1. State-machine Safety\", 1, \"body\", vec![]),\n            section(\"section://next\", \"2 Next\", 1, \"next\", vec![]),\n        ],\n    };\n    let normalized = document.normalized_document_hash().0;\n    let repository = repository_with(document.clone()).await;\n    let use_case = GetDocumentStructureUseCase::new(repository);\n\n    let resolved = use_case\n        .resolve_named_section(command_for(&document, &normalized, \"Section 1 — State-machine Safety\"))\n        .await\n        .expect(\"number separator normalization should resolve\");\n    assert_eq!(resolved.resolution.status, NamedSectionResolutionStatus::Resolved);\n\n    let not_fuzzy = use_case\n        .resolve_named_section(command_for(&document, &normalized, \"State machine Safety\"))\n        .await\n        .expect(\"title-only non-match should be explicit\");\n    assert_eq!(not_fuzzy.resolution.status, NamedSectionResolutionStatus::NotFound);\n}\n\n"
              if marker not in text:
                  raise SystemExit("test insertion marker missing")
              test.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Format all Rust
        run: cargo fmt --all

      - name: Commit semantic alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/get_document_structure.rs tests/named_section_boundary.rs
          git commit -m "fix: normalize only section-number separators"
          git push origin HEAD:feat/issue-69-named-section-boundary
