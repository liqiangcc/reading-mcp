name: Issue 69 one-shot fix

on:
  push:
    branches:
      - feat/issue-69-named-section-boundary

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-69-named-section-boundary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, got {text.count(old)}")
              return text.replace(old, new, 1)

          path = Path("src/application/get_document_structure.rs")
          text = path.read_text(encoding="utf-8")
          text = one(text,
              "                normalized_hash.0,\n                scope.root_section_id.as_ref().map(|id| id.0.clone()),",
              "                normalized_hash.0.clone(),\n                scope.root_section_id.as_ref().map(|id| id.0.clone()),",
              "normalized hash cursor claim")
          path.write_text(text, encoding="utf-8")

          path = Path("src/infrastructure/sqlite.rs")
          text = path.read_text(encoding="utf-8")
          text = one(text,
              "MediaType, NormalizedDocumentHash,\n    NormalizedTextRange",
              "MediaType, NORMALIZATION_VERSION, NormalizedDocumentHash,\n    NormalizedTextRange",
              "normalization import")
          text = one(text,
              "            serde_json::from_str::<StoredDocument>(&json)\n                .map(StoredDocument::into_document)\n                .map_err(|error| ApplicationError::RepositoryFailed(error.to_string()))",
              "            let stored = serde_json::from_str::<StoredDocument>(&json)\n                .map_err(|error| ApplicationError::RepositoryFailed(error.to_string()))?;\n            stored.into_document()",
              "repository load")
          text = one(text,
              "struct StoredDocument {\n    id: String,",
              "struct StoredDocument {\n    #[serde(default)]\n    normalization_version: Option<String>,\n    id: String,",
              "stored version field")
          text = one(text,
              "    fn from_document(document: &Document) -> Self {\n        Self {\n            id: document.id.0.clone(),",
              "    fn from_document(document: &Document) -> Self {\n        Self {\n            normalization_version: Some(NORMALIZATION_VERSION.into()),\n            id: document.id.0.clone(),",
              "stored version save")

          start = text.index("impl StoredDocument {")
          end = text.index("#[derive(Serialize, Deserialize)]\nstruct StoredSection", start)
          block = text[start:end]
          block = one(block,
              "    fn into_document(self) -> Document {\n        Document {",
              "    fn into_document(self) -> Result<Document, ApplicationError> {\n        let persisted_version = self.normalization_version.as_deref().ok_or_else(|| {\n            ApplicationError::RepositoryFailed(\n                \"persisted Document predates normalization-version binding; reopen the source with the current runtime\".into(),\n            )\n        })?;\n        if persisted_version != NORMALIZATION_VERSION {\n            return Err(ApplicationError::RepositoryFailed(format!(\n                \"persisted Document normalization version {persisted_version} is incompatible with {NORMALIZATION_VERSION}; reopen the source with the current runtime\"\n            )));\n        }\n        Ok(Document {",
              "stored version load")
          closing = "        }\n    }\n}\n\n"
          pos = block.rfind(closing)
          if pos < 0:
              raise SystemExit("stored version load: closing block not found")
          block = block[:pos] + "        })\n    }\n}\n\n" + block[pos + len(closing):]
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format all Rust
        run: cargo fmt --all

      - name: Commit one-shot fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/get_document_structure.rs src/infrastructure/sqlite.rs
          git commit -m "fix: preserve normalization migration identity"
          git push origin HEAD:feat/issue-69-named-section-boundary
