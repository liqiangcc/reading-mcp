name: Approved local layout model diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ocr/layout_model_probe.py'
      - 'tests/ocr/test_visual_projection.py'
      - 'src/parsing/pdf_layout_worker.py'
      - '.github/workflows/ocr-layout-model-probe.yml'
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned candidate inference packages (hosted only)
        run: |
          mkdir -p "$RUNNER_TEMP/layout-model-probe"
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5 libtesseract5=5.3.4-1build5 liblept5=1.82.0-3build4 tesseract-ocr-eng=1:4.1.0-2 tesseract-ocr-chi-sim=1:4.1.0-2
          python -m pip install --only-binary=:all: --report "$RUNNER_TEMP/layout-model-probe/pip-report.json" onnxruntime==1.29.0 numpy==2.5.3 opencv-python-headless==4.10.0.84 PyMuPDF==1.28.2 PyYAML==6.0.3 pymupdf4llm==1.28.2 pymupdf-layout==1.28.2
          python -m pip freeze > "$RUNNER_TEMP/layout-model-probe/pip-freeze.txt"
      - name: Source-preserving visual geometry tests
        run: python -m unittest tests/ocr/test_visual_projection.py
      - name: Download and verify fixed public model revision
        run: python scripts/ocr/layout_model_probe.py --candidate PP-DocLayout_plus-L_onnx --prepare --model "$RUNNER_TEMP/layout-model" --output "$RUNNER_TEMP/layout-model-probe"
      - name: Frozen input integrity
        working-directory: tests/fixtures/scanned_pdf
        run: sha256sum -c SHA256SUMS
      - name: Offline CPU diagnostic in bounded network-isolated cgroup
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --property=MemoryMax=768M --property=MemorySwapMax=0 --property=TasksMax=64 --property=PrivateNetwork=yes --property=RuntimeMaxSec=600 --property="WorkingDirectory=$GITHUB_WORKSPACE" --setenv=OMP_NUM_THREADS=1 --setenv=OMP_THREAD_LIMIT=1 --setenv=OPENBLAS_NUM_THREADS=1 --setenv=MKL_NUM_THREADS=1 --setenv=ORT_DISABLE_TELEMETRY=1 "$PROBE_PYTHON" scripts/ocr/layout_model_probe.py --candidate PP-DocLayout_plus-L_onnx --joint-pipeline --sequential-model --model "$RUNNER_TEMP/layout-model" --output "$RUNNER_TEMP/layout-model-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-layout-model-diagnostic
          path: ${{ runner.temp }}/layout-model-probe
          retention-days: 14
