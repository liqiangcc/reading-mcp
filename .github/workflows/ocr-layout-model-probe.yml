name: Approved local layout model diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ocr/layout_model_probe.py'
      - '.github/workflows/ocr-layout-model-probe.yml'
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned candidate inference packages (hosted only)
        run: |
          mkdir -p "$RUNNER_TEMP/layout-model-probe"
          python -m pip install --only-binary=:all: --report "$RUNNER_TEMP/layout-model-probe/pip-report.json" paddlepaddle==3.0.0 'paddlex[ocr]==3.1.0' PyMuPDF==1.28.2
          python -m pip freeze > "$RUNNER_TEMP/layout-model-probe/pip-freeze.txt"
      - name: Download and verify fixed public model revision
        run: python scripts/ocr/layout_model_probe.py --prepare --model "$RUNNER_TEMP/layout-model" --output "$RUNNER_TEMP/layout-model-probe"
      - name: Frozen input integrity
        working-directory: tests/fixtures/scanned_pdf
        run: sha256sum -c SHA256SUMS
      - name: Offline CPU diagnostic in bounded network-isolated cgroup
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --property=MemoryMax=2G --property=TasksMax=64 --property=PrivateNetwork=yes --property=RuntimeMaxSec=600 --property="WorkingDirectory=$GITHUB_WORKSPACE" --setenv=OMP_NUM_THREADS=1 --setenv=OPENBLAS_NUM_THREADS=1 --setenv=MKL_NUM_THREADS=1 --setenv=PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True "$PROBE_PYTHON" scripts/ocr/layout_model_probe.py --model "$RUNNER_TEMP/layout-model" --output "$RUNNER_TEMP/layout-model-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-layout-model-diagnostic
          path: ${{ runner.temp }}/layout-model-probe
          retention-days: 14
