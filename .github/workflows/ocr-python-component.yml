name: OCR offline Python dependency component
on:
  push:
    paths:
      - 'scripts/ocr/package_python_dependencies.py'
      - 'scripts/ocr/package_engine_dependencies.py'
      - 'scripts/ocr/verify_engine_component.py'
      - 'tests/ocr/test_engine_component.py'
      - 'scripts/pdf-layout/requirements.txt'
      - '.github/workflows/ocr-python-component.yml'
  pull_request:
    paths:
      - 'scripts/ocr/package_python_dependencies.py'
      - 'scripts/ocr/package_engine_dependencies.py'
      - 'scripts/ocr/verify_engine_component.py'
      - 'tests/ocr/test_engine_component.py'
      - 'scripts/pdf-layout/requirements.txt'
      - '.github/workflows/ocr-python-component.yml'
permissions:
  contents: read
jobs:
  offline-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive corruption and path validation tests
        run: python3 -m unittest tests/ocr/test_engine_component.py
      - name: Resolve complete Debian closure without installed-package shortcuts
        run: |
          sudo apt-get update -qq
          python3 scripts/ocr/package_engine_dependencies.py --output "$RUNNER_TEMP/ocr-engine-component"
      - name: Archive and reconstruct from verified immutable inputs offline
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ocr-engine-component.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/ocr-engine-component" debs manifest.json apt-source-uris.txt
          sha256sum "$archive"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          sudo unshare --net -- /usr/bin/python3 scripts/ocr/verify_engine_component.py \
            --archive "$archive" --sha256 "$digest" --output "$RUNNER_TEMP/verified-ocr-engine"
      - name: Start extracted engine without host libraries or network
        run: |
          set -euo pipefail
          engine_root="$RUNNER_TEMP/verified-ocr-engine"
          sudo mkdir -p "$engine_root/tmp"
          sudo cp tests/fixtures/scanned_pdf/previews/F07-p1.png "$engine_root/tmp/public-F07.png"
          sudo unshare --net -- chroot "$engine_root" /usr/bin/tesseract --version
          sudo unshare --net -- chroot "$engine_root" /usr/bin/tesseract \
            /tmp/public-F07.png stdout --tessdata-dir /usr/share/tesseract-ocr/5/tessdata \
            -l chi_sim --oem 1 --psm 3 > "$RUNNER_TEMP/engine-offline-smoke.txt"
          test -s "$RUNNER_TEMP/engine-offline-smoke.txt"
          du -sb "$engine_root" "$RUNNER_TEMP/ocr-engine-component/debs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-engine-component-candidate
          path: |
            ${{ runner.temp }}/ocr-engine-component/manifest.json
            ${{ runner.temp }}/ocr-engine-component/apt-source-uris.txt
            ${{ runner.temp }}/engine-offline-smoke.txt
            ${{ runner.temp }}/ocr-engine-component.tar.gz
          if-no-files-found: warn
          retention-days: 14
  offline-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and hash every pinned wheel, retain notices
        run: python scripts/ocr/package_python_dependencies.py --output "$RUNNER_TEMP/ocr-python-component"
      - name: Install in fresh environment with network namespace disabled
        env:
          HOST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          python -m venv --without-pip "$RUNNER_TEMP/offline-ocr-python"
          sudo unshare --net -- "$HOST_PYTHON" -m pip --python "$RUNNER_TEMP/offline-ocr-python/bin/python" install \
            --no-index --no-cache-dir --require-hashes \
            --find-links "$RUNNER_TEMP/ocr-python-component/wheels" \
            -r "$RUNNER_TEMP/ocr-python-component/requirements.lock"
          sudo unshare --net -- "$RUNNER_TEMP/offline-ocr-python/bin/python" -I -c \
            'import pymupdf, pymupdf4llm, onnxruntime; pymupdf4llm.use_layout(True); print("offline pinned layout imports: ok")'
          du -sb "$RUNNER_TEMP/offline-ocr-python" "$RUNNER_TEMP/ocr-python-component"
      - name: Archive candidate component (not a release or deployment)
        run: |
          tar -czf "$RUNNER_TEMP/ocr-python-component.tar.gz" -C "$RUNNER_TEMP" ocr-python-component
          sha256sum "$RUNNER_TEMP/ocr-python-component.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-python-component-candidate
          path: |
            ${{ runner.temp }}/ocr-python-component/manifest.json
            ${{ runner.temp }}/ocr-python-component.tar.gz
          if-no-files-found: warn
          retention-days: 14
