name: Package reading-mcp release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag, for example v0.1.0; empty validates the dispatched ref
        required: false
        default: ''
      expected_sha:
        description: Exact frozen source commit SHA; empty validates the dispatched ref
        required: false
        default: ''
      target_triple:
        description: Rust target triple
        required: true
        default: x86_64-unknown-linux-gnu
      platform:
        description: Artifact platform label
        required: true
        default: linux-x86_64
      publish_assets:
        description: Upload archive and SHA256SUMS to the existing GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-${{ github.repository }}-${{ inputs.tag || github.ref_name }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:11
    outputs:
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
    steps:
      - name: Resolve package mode
        id: mode
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          EXPECTED_SHA_INPUT: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          PLATFORM_INPUT: ${{ inputs.platform }}
          PUBLISH_ASSETS: ${{ inputs.publish_assets }}
        run: |
          set -euo pipefail
          if [[ -z "$TAG_INPUT" && -z "$EXPECTED_SHA_INPUT" ]]; then
            echo "source_ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
            echo "expected_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
            echo "verify_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-candidate-package" >> "$GITHUB_OUTPUT"
            if [[ "$PUBLISH_ASSETS" == "true" ]]; then
              echo "publish_assets requires an immutable release tag" >&2
              exit 1
            fi
          elif [[ -n "$TAG_INPUT" && -n "$EXPECTED_SHA_INPUT" ]]; then
            [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            [[ "$EXPECTED_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
            echo "source_ref=$TAG_INPUT" >> "$GITHUB_OUTPUT"
            echo "expected_sha=$EXPECTED_SHA_INPUT" >> "$GITHUB_OUTPUT"
            echo "verify_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=reading-mcp-$TAG_INPUT-$PLATFORM_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "tag and expected_sha must either both be set or both be empty" >&2
            exit 1
          fi

      - name: Install Debian 11 build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential binutils python3 pkg-config perl

      - name: Checkout packaging infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packaging

      - name: Trust the container checkouts
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/packaging"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"

      - name: Record packaging infrastructure identity
        shell: bash
        run: |
          set -euo pipefail
          echo "PACKAGING_COMMIT_SHA=$(git -C packaging rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.source_ref }}
          fetch-depth: 0
          path: source

      - name: Verify source identity before build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.mode.outputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFY_RELEASE_TAG: ${{ steps.mode.outputs.verify_release_tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha=$(git -C source rev-parse 'HEAD^{commit}')
          tag_sha="$actual_sha"
          if [[ "$VERIFY_RELEASE_TAG" == "true" ]]; then
            tag_sha=$(python3 - <<'PY'
          import json
          import os
          import urllib.request

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref = api(f"git/ref/tags/{os.environ['RELEASE_TAG']}")
          obj = ref["object"]
          if obj["type"] == "tag":
              obj = api(f"git/tags/{obj['sha']}")["object"]
          print(obj["sha"])
          PY
          )
          fi
          source_status=$(git -C source status --porcelain --untracked-files=all)
          printf 'source_sha=%s tag_sha=%s status_bytes=%s verify_tag=%s\n' "$actual_sha" "$tag_sha" "${#source_status}" "$VERIFY_RELEASE_TAG"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$tag_sha" == "$EXPECTED_SHA" ]]
          [[ -z "$source_status" ]]

      - name: Install pinned Rust toolchain with rustup
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.99.1
          rustc --version
          gcc --version | head -1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source

      - name: Build and verify package
        shell: bash
        env:
          REPO_DIR: ${{ github.workspace }}/source
          RELEASE_SHA: ${{ steps.mode.outputs.expected_sha }}
          VERIFY_RELEASE_TAG: ${{ steps.mode.outputs.verify_release_tag }}
          TARGET_TRIPLE: ${{ inputs.target_triple }}
          PLATFORM: ${{ inputs.platform }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          PACKAGING_COMMIT_SHA: ${{ env.PACKAGING_COMMIT_SHA }}
        run: |
          set -euo pipefail
          cargo_version=$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('source/Cargo.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit('could not read package version')
          print(match.group(1))
          PY
          )
          version="$cargo_version"
          export RELEASE_TAG="v$version"
          if [[ -n "${{ inputs.tag }}" ]]; then
            version="${{ inputs.tag }}"
            version="${version#v}"
            export RELEASE_TAG="${{ inputs.tag }}"
          fi
          export RELEASE_VERSION="$version"
          bash packaging/scripts/package-release.sh

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable GitHub Release assets
        if: ${{ inputs.publish_assets }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          archive=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          for asset in "$archive" dist/SHA256SUMS; do
            name=$(basename "$asset")
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "refusing to overwrite existing release asset: $name" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" "$archive" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"

  portability:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:11
          - debian:12
    name: portable smoke ${{ matrix.image }}
    steps:
      - name: Checkout packaging infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download candidate package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate

      - name: Verify and unpack candidate package
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/candidate"
          sha256sum -c SHA256SUMS
          mkdir -p extracted
          tar -xzf ./*.tar.gz -C extracted
          package_dir=$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$package_dir"
          test -x "$package_dir/reading-mcp"
          echo "PACKAGE_DIR=${{ runner.temp }}/candidate/$package_dir" >> "$GITHUB_ENV"
          python3 - "$package_dir/release-manifest.json" <<'PY'
          import json
          import re
          import sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          print('manifest target:', manifest.get('target'))
          print('manifest libc requirement:', manifest.get('binary_libc_requirement'))
          requirement = str(manifest.get('binary_libc_requirement', ''))
          match = re.fullmatch(r'GLIBC_(\d+)\.(\d+)', requirement)
          if not match or tuple(int(part) for part in match.groups()) > (2, 31):
              raise SystemExit('release manifest binary_libc_requirement must be GLIBC_2.31 or lower')
          PY

      - name: Pull ${{ matrix.image }}
        run: docker pull ${{ matrix.image }}

      - name: Smoke-test inside ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-smoke.py \
            --binary "$PACKAGE_DIR/reading-mcp" \
            --pdf tests/fixtures/pdf_tex/type1-builtin.pdf \
            --work-dir "${{ runner.temp }}/portability-smoke" \
            --image "${{ matrix.image }}"
