name: PDF corpus
run-name: PDF corpus (PDF-1a)
on:
  workflow_dispatch:
    inputs:
      select:
        description: 'Rebuild scripts/pdf-corpus-ids.txt (downloads candidates to check licence and pages)'
        type: boolean
        default: false
  push:
    branches: ['bench/pdf1a-**']

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tooling
        run: pip install pymupdf==1.28.2
      - name: Decide whether the corpus list must be rebuilt
        id: gate
        run: |
          if [ "${{ github.event.inputs.select }}" = "true" ] || [ ! -s scripts/pdf-corpus-ids.txt ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "scripts/pdf-corpus-ids.txt is committed; nothing to select"
          fi
      - name: Select the CC-BY corpus from the arXiv API
        if: steps.gate.outputs.run == 'yes'
        run: |
          set -o pipefail
          python3 scripts/pdf-corpus.py --select \
            --out scripts/pdf-corpus-ids.txt \
            --work-dir "$RUNNER_TEMP/select" | tail -150
      - name: Show the selected list
        if: steps.gate.outputs.run == 'yes'
        run: tail -32 scripts/pdf-corpus-ids.txt
      - name: Upload the corpus list
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-corpus-ids
          path: scripts/pdf-corpus-ids.txt
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin reading-mcp 2>&1 | tail -40
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pdf-corpus-bin
          path: target/release/reading-mcp

  probe:
    needs: [build, select]
    if: always() && needs.build.result == 'success' && needs.select.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: probe shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe tooling
        run: pip install pymupdf==1.28.2
      - name: Is the corpus list committed yet?
        id: corpus
        run: |
          if [ -s scripts/pdf-corpus-ids.txt ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "scripts/pdf-corpus-ids.txt is not committed yet; this push only selects it"
          fi
      - name: Restore pip cache for the layout environment
        if: steps.corpus.outputs.present == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pdf-layout-${{ hashFiles('scripts/pdf-layout/requirements.txt') }}
      - name: Create the pinned layout environment
        if: steps.corpus.outputs.present == 'yes'
        env:
          PDF_LAYOUT_VENV: ${{ github.workspace }}/.pdf-layout-venv
          PYTHON: python3
        run: bash scripts/pdf-layout/setup-pdf-layout.sh 2>&1 | tail -20
      - uses: actions/download-artifact@v4
        if: steps.corpus.outputs.present == 'yes'
        with:
          name: pdf-corpus-bin
          path: ${{ runner.temp }}/bin
      - name: Run the corpus shard ${{ matrix.shard }}
        if: steps.corpus.outputs.present == 'yes'
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/bin/reading-mcp"
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/work"
          python3 scripts/pdf-corpus.py \
            --corpus scripts/pdf-corpus-ids.txt \
            --shard ${{ matrix.shard }} --shards 3 \
            --binary "$RUNNER_TEMP/bin/reading-mcp" \
            --layout-python "$GITHUB_WORKSPACE/.pdf-layout-venv/bin/python" \
            --work-dir "$RUNNER_TEMP/work" \
            --state-root "$RUNNER_TEMP/state" \
            --out "$RUNNER_TEMP/results/corpus-${{ matrix.shard }}.jsonl" \
            --deadline-minutes 65 \
            --paper-deadline-minutes 6 \
            --worker-timeout 600 | tail -150
      - name: Upload shard results
        if: always() && steps.corpus.outputs.present == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-corpus-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [probe]
    if: always() && needs.probe.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-corpus-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/all
      - name: Merge every shard into the final tables
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/final"
          python3 scripts/pdf-corpus.py --aggregate \
            --jsonl-dir "$RUNNER_TEMP/all" \
            --out "$RUNNER_TEMP/final/pdf-corpus-summary.json" \
            --markdown "$RUNNER_TEMP/final/pdf-corpus.md" | tail -150
          cat "$RUNNER_TEMP/final/pdf-corpus.md" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/final"
      - name: Upload final tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-corpus-final
          path: |
            ${{ runner.temp }}/final/
            ${{ runner.temp }}/all/
          if-no-files-found: warn
          retention-days: 14
