name: PDF quality probe
run-name: PDF quality probe (PDF-6a) ${{ inputs.backend || 'default' }}
on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: 'Comma-separated arXiv ids to measure instead of the whole corpus (empty = all)'
        default: ''
      backend:
        description: 'PDF backend: default (unchanged since PDF-6a) or layout (PyMuPDF layout)'
        type: choice
        options: [default, layout]
        default: default
      keep_coarse_text:
        description: 'Also record the full text of every coarse paragraph, at any length (PDF-6e; default off)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      keep_pdf_sentence_text:
        description: 'Also record every PDF paragraph''s full text and the stream totals (PDF-6g; default off)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      tools:
        description: 'Tool set the probe servers expose'
        required: false
        default: 'v1'
  # Before this workflow exists on the default branch, GitHub cannot dispatch it on a branch
  # (a workflow_dispatch run needs the file on `main`), so a push to the PDF-6a branch whose
  # commit message contains `[quality-run]` starts it instead - the same pattern PDF-5a used
  # with `bench/pdf5a-**`. Once merged, `workflow_dispatch` is the trigger that matters.
  push:
    branches: ['docs/pdf6a-**']
concurrency:
  group: pdf-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[quality-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin reading-mcp 2>&1 | tail -20
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pdf-quality-bin
          path: target/release/reading-mcp

  probe:
    needs: [build]
    runs-on: ubuntu-latest
    # The layout backend spends 4-10 s per open where the default backend spends under 0.1 s, and
    # a refused paper is measured twice (the open and the reason probe), so the layout shards get
    # a longer shard deadline. `default` keeps PDF-6a's 68 minutes exactly.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: quality shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reference tooling
        run: pip install pymupdf==1.28.2
      - name: Restore pip cache for the layout environment
        if: inputs.backend == 'layout'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pdf-layout-${{ hashFiles('scripts/pdf-layout/requirements.txt') }}
      - name: Create the pinned layout environment
        if: inputs.backend == 'layout'
        env:
          PDF_LAYOUT_VENV: ${{ github.workspace }}/.pdf-layout-venv
          PYTHON: python3
        run: |
          bash scripts/pdf-layout/setup-pdf-layout.sh 2>&1 | tail -20
          {
            echo "### Layout environment"
            echo
            echo '```'
            du -sh "$PDF_LAYOUT_VENV"
            "$PDF_LAYOUT_VENV/bin/python" -I -c 'import importlib.metadata as m; print(" ".join(f"{n}=={m.version(n)}" for n in ("pymupdf", "pymupdf4llm", "pymupdf-layout", "onnxruntime")))'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: pdf-quality-bin
          path: ${{ runner.temp }}/bin
      - name: Is the 600 MB memory cap available on this runner?
        run: |
          if sudo systemd-run --scope --quiet -p MemoryMax=256M -p MemorySwapMax=0 \
              -- /bin/true; then
            echo "systemd-run MemoryMax scope: available"
          else
            echo "::warning::systemd-run MemoryMax scope is not available; runs would be uncapped"
          fi
      - name: Calibrate the tree sampler on this runner
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os, subprocess, sys, time

          spec = importlib.util.spec_from_file_location("pdf_quality", "scripts/pdf-quality.py")
          quality = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(quality)

          # The sampler is calibrated against an allocation it cannot miss: a child that holds
          # 200 MiB inside the same `systemd-run --scope` the measurement uses.
          code = "import time\nb=bytearray(200*1024*1024)\nb[::4096]=b'x'*(len(b)//4096)\ntime.sleep(1.5)"
          command = ["sudo", "systemd-run", "--scope", "--quiet", "-p", "MemoryMax=600M",
                     "-p", "MemorySwapMax=0", "--uid=%d" % os.getuid(),
                     "--gid=%d" % os.getgid(), "--", sys.executable, "-c", code]
          process = subprocess.Popen(command)
          peak = quality.TreePeak(process.pid)
          peak.start()
          time.sleep(0.2)
          peak.snapshot()
          time.sleep(1.6)
          peak.snapshot()
          tree = quality.process_tree(process.pid)
          by_cgroup = {}
          for pid in tree:
              by_cgroup.setdefault(quality.cgroup_dir(pid), []).append(
                  (pid, quality.resident_kib(pid)))
          process.wait()
          time.sleep(0.1)
          facts = peak.stop()
          print("### Tree sampler calibration")
          print()
          print("```")
          print("tree at 1.8 s:", [(pid, rss) for pids in by_cgroup.values() for pid, rss in pids])
          for path, pids in by_cgroup.items():
              peak_bytes = quality.read_int_file(os.path.join(path, "memory.peak")) if path else None
              print("cgroup", path, "pids", pids,
                    "memory.peak MiB", None if peak_bytes is None else round(peak_bytes / 1024 / 1024, 1))
          print("facts", json.dumps(facts, sort_keys=True))
          print("```")
          if facts["peak_tree_kib"] < 190 * 1024:
              print("::warning::the tree sampler missed a known 200 MiB allocation")
          PY
      - name: Restrict the corpus list to the requested ids
        if: github.event.inputs.only_ids != '' || vars.PDF6A_ONLY_IDS != ''
        env:
          ONLY_IDS: ${{ github.event.inputs.only_ids || vars.PDF6A_ONLY_IDS }}
        run: |
          python3 - <<'PY'
          import json, os
          wanted = {item.strip() for item in os.environ['ONLY_IDS'].split(',') if item.strip()}
          kept = []
          with open('scripts/pdf-sweep-ids.txt', encoding='utf-8') as handle:
              for line in handle:
                  if line.startswith('#'):
                      kept.append(line)
                      continue
                  if line.strip() and json.loads(line)['id'] in wanted:
                      kept.append(line)
          with open('scripts/pdf-sweep-ids.txt', 'w', encoding='utf-8') as handle:
              handle.writelines(kept)
          print(f'kept {len(kept)} lines for {len(wanted)} ids')
          PY
      - name: Run the quality shard ${{ matrix.shard }}
        env:
          BACKEND: ${{ inputs.backend || 'default' }}
          # `default` keeps PDF-6a's 68 minutes; `layout` opens 50-100x slower and probes every
          # refusal a second time.
          DEADLINE: ${{ inputs.backend == 'layout' && '100' || '68' }}
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/bin/reading-mcp"
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/work"
          args=(--ids scripts/pdf-sweep-ids.txt
                --shard ${{ matrix.shard }} --shards 8
                --binary "$RUNNER_TEMP/bin/reading-mcp"
                --work-dir "$RUNNER_TEMP/work"
                --state-root "$RUNNER_TEMP/state"
                --out "$RUNNER_TEMP/results/quality-${{ matrix.shard }}.jsonl"
                --deadline-minutes "$DEADLINE"
                --per-document-minutes 6
                --backend "$BACKEND"
                --tools "${{ inputs.tools || 'v1' }}")
          if [ "$BACKEND" = "layout" ]; then
            args+=(--layout-python "$GITHUB_WORKSPACE/.pdf-layout-venv/bin/python"
                   --venv-path "$GITHUB_WORKSPACE/.pdf-layout-venv")
          fi
          if [ "${{ github.event.inputs.keep_coarse_text }}" = "true" ]; then
            args+=(--keep-coarse-text)
          fi
          if [ "${{ github.event.inputs.keep_pdf_sentence_text }}" = "true" ]; then
            args+=(--keep-pdf-sentence-text)
          fi
          python3 scripts/pdf-quality.py "${args[@]}" | tail -200
      - name: Upload the shard's per-unit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-quality-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [probe]
    # A push without the `[quality-run]` marker skips build and probe; the aggregate must not
    # then run against artifacts that do not exist.
    if: always() && needs.probe.result != 'cancelled' && needs.probe.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-quality-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/all
      - name: Merge every shard into the PDF-6a and PDF-7a tables
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/final"
          python3 scripts/pdf-quality.py --aggregate \
            --jsonl-dir "$RUNNER_TEMP/all" \
            --out "$RUNNER_TEMP/final/pdf-quality-summary.json" \
            --markdown "$RUNNER_TEMP/final/pdf-quality.md" | tail -400
          cat "$RUNNER_TEMP/final/pdf-quality.md" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/final"
      - name: Upload the merged tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-quality-final
          path: |
            ${{ runner.temp }}/final/
            ${{ runner.temp }}/all/
          if-no-files-found: warn
          retention-days: 14
