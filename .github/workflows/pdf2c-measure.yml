name: PDF2c open memory
run-name: PDF2c open memory (before/after)
on:
  workflow_dispatch:
  push:
    branches: ['bench/pdf2c**']

env:
  # Same build shape as heap-profile.yml: line tables so heaptrack's peak consumers name
  # `src/...:line` frames of this checkout.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: pdf2c
      - name: Build release binary with line tables
        run: cargo build --release --locked --bin reading-mcp 2>&1 | tail -5
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pdf2c-bin
          path: ${{ github.workspace }}/target/release/reading-mcp

  measure:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tooling and heaptrack
        run: |
          pip install pymupdf==1.28.2 2>&1 | tail -3
          sudo apt-get update && sudo apt-get install -y heaptrack
      - name: Download the heaviest corpus documents
        run: |
          set -o pipefail
          IN="$RUNNER_TEMP/inputs"
          mkdir -p "$IN"
          for id in 2401.14345 2403.19144 2403.18575 2510.07408 2603.17845 2305.18793; do
            if curl -fsSL --retry 3 -o "$IN/$id.pdf" "https://arxiv.org/pdf/$id"; then
              echo "$id: $(stat -c%s "$IN/$id.pdf") bytes"
            else
              echo "::error::failed to download $id"
              exit 1
            fi
            want=$(python3 -c 'import json,sys; print(next(e["sha256"] for e in (json.loads(l) for l in open("scripts/pdf-sweep-ids.txt", encoding="utf-8") if l.strip().startswith("{")) if e["id"] == sys.argv[1]))' "$id")
            got=$(sha256sum "$IN/$id.pdf" | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then
              echo "::error::$id is not the pinned corpus PDF (want $want, got $got)"
              exit 1
            fi
            echo "$id: sha256 matches scripts/pdf-sweep-ids.txt"
          done
      - name: Download the synthetic text PDF sources and generate them
        run: |
          set -o pipefail
          IN="$RUNNER_TEMP/inputs"
          mkdir -p "$IN"
          curl -fsSL --retry 3 -o "$IN/war-and-peace.txt" "https://www.gutenberg.org/cache/epub/2600/pg2600.txt"
          curl -fsSL --retry 3 -o "$IN/song-shi.epub" "https://www.gutenberg.org/cache/epub/24183/pg24183-images.epub"
          export IN
          python3 -c 'import importlib.util, os; spec = importlib.util.spec_from_file_location("gen", "scripts/pdf-gen-inputs.py"); gen = importlib.util.module_from_spec(spec); spec.loader.exec_module(gen); target = os.environ["IN"]; war = gen.read_plain_text(os.path.join(target, "war-and-peace.txt")); song = gen.extract_epub_text(os.path.join(target, "song-shi.epub")); assert war is not None; assert song is not None; [gen.build_long_text(target, "text-long-en-%d" % p, war, cjk=False, font_path="helv", pages=p) for p in (100, 300)]; [gen.build_long_text(target, "text-long-cjk-%d" % p, song, cjk=True, font_path=gen.CJK_FONT, pages=p) for p in (100, 300)]; print("generated")' 2>&1 | tail -3
          ls -l "$IN"/*.pdf
      - uses: actions/download-artifact@v4
        with:
          name: pdf2c-bin
          path: ${{ runner.temp }}/bin
      - name: Open every input under telemetry (peak RSS, phases, resident)
        run: |
          set -o pipefail
          IN="$RUNNER_TEMP/inputs"
          BIN="$RUNNER_TEMP/bin/reading-mcp"
          chmod +x "$BIN"
          mkdir -p "$RUNNER_TEMP/perf"
          python3 scripts/pdf-open-profile.py --mode run \
            --binary "$BIN" \
            --out "$RUNNER_TEMP/perf/runs.json" \
            --out-dir "$RUNNER_TEMP/perf" \
            --state-dir "$RUNNER_TEMP/state" \
            --timeout 600 \
            --input "p2401.14345=$IN/2401.14345.pdf" \
            --input "p2403.19144=$IN/2403.19144.pdf" \
            --input "p2403.18575=$IN/2403.18575.pdf" \
            --input "p2510.07408=$IN/2510.07408.pdf" \
            --input "p2603.17845=$IN/2603.17845.pdf" \
            --input "p2305.18793=$IN/2305.18793.pdf" \
            --input "text-long-en-100=$IN/text-long-en-100.pdf" \
            --input "text-long-en-300=$IN/text-long-en-300.pdf" \
            --input "text-long-cjk-100=$IN/text-long-cjk-100.pdf" \
            --input "text-long-cjk-300=$IN/text-long-cjk-300.pdf" 2>&1 | tail -30
      - name: Stored bytes and extracted text bytes per input
        if: always()
        run: |
          set -o pipefail
          IN="$RUNNER_TEMP/inputs"
          BIN="$RUNNER_TEMP/bin/reading-mcp"
          mkdir -p "$RUNNER_TEMP/facts"
          python3 scripts/sqlite-facts.py --binary "$BIN" --out-dir "$RUNNER_TEMP/facts" \
            --documents "p2401.14345=$IN/2401.14345.pdf" \
            --documents "p2403.19144=$IN/2403.19144.pdf" \
            --documents "p2403.18575=$IN/2403.18575.pdf" \
            --documents "p2510.07408=$IN/2510.07408.pdf" \
            --documents "p2603.17845=$IN/2603.17845.pdf" \
            --documents "p2305.18793=$IN/2305.18793.pdf" \
            --documents "text-long-en-100=$IN/text-long-en-100.pdf" \
            --documents "text-long-en-300=$IN/text-long-en-300.pdf" \
            --documents "text-long-cjk-100=$IN/text-long-cjk-100.pdf" \
            --documents "text-long-cjk-300=$IN/text-long-cjk-300.pdf" \
            --parse-timeout-seconds 600 --run-timeout-seconds 600 2>&1 | tee "$RUNNER_TEMP/facts/facts.txt" | tail -20
      - name: Heap peak and its top consumers (heaptrack)
        if: always()
        run: |
          set -o pipefail
          IN="$RUNNER_TEMP/inputs"
          BIN="$RUNNER_TEMP/bin/reading-mcp"
          mkdir -p heap
          python3 scripts/memory-profile.py --binary "$BIN" --states dir \
            --parse-timeout-seconds 600 --run-timeout-seconds 600 \
            --documents "p2401.14345=$IN/2401.14345.pdf,p2403.19144=$IN/2403.19144.pdf,text-long-cjk-300=$IN/text-long-cjk-300.pdf,text-long-en-300=$IN/text-long-en-300.pdf" \
            --wrapper "heaptrack -o heap/{label}" --out heap/runs.json 2>&1 | tail -20
          for f in heap/p2401.14345.zst heap/p2403.19144.zst heap/text-long-cjk-300.zst heap/text-long-en-300.zst; do
            if [ ! -e "$f" ]; then
              echo "missing $f"
              continue
            fi
            echo "=== $f"
            heaptrack_print --file "$f" --print-peaks=1 --peak-limit=30 --sub-peak-limit=20 \
              --print-allocators=0 --print-temporary=0 --print-leaks=0 --print-histogram=0 \
              > "$f.peaks.txt" 2>&1 || true
            grep -E "peak heap memory consumption|peak RSS" "$f.peaks.txt" || true
            head -200 "$f.peaks.txt"
          done
      - name: Build the measurement note's tables
        if: always()
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/pdf2c-tables.md"
          python3 - "$RUNNER_TEMP" > "$OUT" <<'PY'
          import json
          import os
          import re
          import sys

          root = sys.argv[1]
          runs_path = os.path.join(root, "perf", "runs.json")
          facts_path = os.path.join(root, "facts", "facts.txt")
          mib = 1024.0
          phases = (
              ("retrieve", "retrieve"),
              ("parse", "parse"),
              ("save", "repository_save"),
              ("unit sets", "text_unit_sets_write"),
              ("index", "index"),
          )

          runs = json.load(open(runs_path)) if os.path.exists(runs_path) else []
          facts = {}
          if os.path.exists(facts_path):
              for line in open(facts_path):
                  if not line.startswith("input="):
                      continue
                  fields = dict(part.split("=", 1) for part in line.split() if "=" in part)
                  facts[fields["input"]] = fields

          print("### Peak RSS, resident RSS and the ratio to extracted text")
          print()
          print("| input | file MiB | open s | peak RSS MiB | resident MiB "
                "| extracted text bytes | peak / text |")
          print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
          for row in runs:
              label = row["label"]
              fact = facts.get(label, {})
              text_bytes = int(fact.get("section_text_bytes", 0) or 0)
              peak = row["peak_rss_kib"] or 0
              resident = row.get("rss_after_open_kib") or 0
              ratio = f"{peak * 1024 / text_bytes:.1f}x" if text_bytes else "-"
              print(f"| {label} | {row['bytes'] / mib:.1f} | {row['open_seconds']} | "
                    f"{peak / 1024:.1f} | {resident / 1024:.1f} | {text_bytes} | {ratio} |")
          print()
          print("### RSS after each open phase (rss/hwm MiB)")
          print()
          print("| input | " + " | ".join(name for name, _ in phases) + " |")
          print("| --- |" + " ---: |" * len(phases))
          for row in runs:
              phase_rss = row.get("phase_rss") or {}
              cells = []
              for _, event in phases:
                  value = phase_rss.get(event)
                  cells.append("-" if not value
                               else f"{value[0] / 1024:.1f}/{value[1] / 1024:.1f}")
              print(f"| {row['label']} | " + " | ".join(cells) + " |")
          print()
          print("### Peak heap (heaptrack)")
          print()
          print("| input | peak heap MiB | peak RSS MiB |")
          print("| --- | ---: | ---: |")

          def to_mib(match):
              if not match:
                  return "-"
              scale = {"K": 1 / 1024, "M": 1, "G": 1024}[match.group(2)]
              return f"{float(match.group(1)) * scale:.1f}"

          heap_dir = os.path.join(os.getcwd(), "heap")
          if os.path.isdir(heap_dir):
              for name in sorted(os.listdir(heap_dir)):
                  if not name.endswith(".peaks.txt"):
                      continue
                  text = open(os.path.join(heap_dir, name), errors="replace").read()
                  heap = re.search(
                      r"peak heap memory consumption: ([0-9.]+)([KMG])", text)
                  rss = re.search(
                      r"peak RSS \(including heaptrack overhead\): ([0-9.]+)([KMG])", text)
                  print(f"| {name[: -len('.peaks.txt')]} | {to_mib(heap)} | {to_mib(rss)} |")
          PY
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT"
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf2c-measure
          path: |
            ${{ runner.temp }}/perf/
            ${{ runner.temp }}/facts/
            heap/
            ${{ runner.temp }}/pdf2c-tables.md
          if-no-files-found: warn
          retention-days: 14
