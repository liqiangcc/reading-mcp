name: Phase 7 Lockfile

on:
  push:
    branches:
      - feat/phase7-streamable-http

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git rm .github/workflows/phase7-lock.yml
          git commit -m "chore: lock Phase 7 HTTP dependencies"
          git pull --rebase origin feat/phase7-streamable-http
          git push origin HEAD:feat/phase7-streamable-http
