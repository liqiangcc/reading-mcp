name: Release Cleanup

on:
  push:
    branches:
      - feat/release-hardening

permissions:
  actions: read
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify finalizer passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          conclusion=$(gh api "/repos/${REPO}/actions/workflows/release-finalize.yml/runs?branch=feat/release-hardening&per_page=1" --jq '.workflow_runs[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "Release Finalize has not passed; refusing cleanup (latest conclusion: $conclusion)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary release workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/release-clippy-fix.yml \
            .github/workflows/release-finalize.yml \
            .github/workflows/release-cleanup.yml
          if git diff --cached --quiet; then
            echo "No temporary release workflows remain"
            exit 0
          fi
          git commit -m "ci: clean temporary release workflows"
          git push origin HEAD:feat/release-hardening
