name: Release Clippy Fix

on:
  push:
    branches:
      - feat/release-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply Clippy fixes
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --fix --locked --allow-dirty --allow-staged --all-targets --all-features -- -D warnings 2>&1 | tee clippy-fix.log
          cargo fmt --all

      - name: Commit automatic fixes
        run: |
          if git diff --quiet; then
            echo "No automatic Clippy changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply release Clippy fixes"
          git push origin HEAD:feat/release-hardening

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-fix-log
          path: clippy-fix.log
          if-no-files-found: ignore
          retention-days: 1
