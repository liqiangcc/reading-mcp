name: Release Finalize v3

on:
  push:
    branches:
      - feat/release-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply mechanical fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/parsing/epub.rs', 'src/parsing/docx.rs']:
              path = Path(name)
              if path.exists():
                  path.write_text(path.read_text().replace('        drop(archive);\n', ''))
          PY
          cargo fmt --all
          cargo fix --locked --allow-dirty --allow-staged --all-targets --all-features || true
          cargo clippy --fix --locked --allow-dirty --allow-staged --all-targets --all-features || true
          cargo fmt --all

      - name: Verify final source gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

      - name: Record verified source gate
        run: |
          cat > docs/release-gate-status.md <<EOF
          # Release Gate Status

          GitHub Actions verified the v0.1 release-candidate source tree at parent commit \`${GITHUB_SHA}\` using Rust stable and the committed \`Cargo.lock\`.

          Verified commands:

          - \`cargo fmt --all -- --check\`
          - \`cargo clippy --locked --all-targets --all-features -- -D warnings\`
          - \`cargo test --locked --all-features\`

          The test suite includes architecture-boundary enforcement, real stdio MCP E2E, persistent restart behavior, conditional HTTP revalidation, auth redirect isolation, resource budgets, SQLite FTS, the Text/Markdown/HTML/PDF stdio acceptance matrix, and EPUB/DOCX/OpenAPI parser integration tests.
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/release-hardening-plan.md')
          if path.exists():
              text = path.read_text()
              text = text.replace('[ ] cargo fmt --all -- --check', '[x] cargo fmt --all -- --check')
              text = text.replace('[ ] cargo clippy --all-targets --all-features -- -D warnings', '[x] cargo clippy --locked --all-targets --all-features -- -D warnings')
              text = text.replace('[ ] cargo test --all-features', '[x] cargo test --locked --all-features')
              text = text.replace('[ ] real stdio acceptance matrix green', '[x] real stdio acceptance matrix green')
              text = text.replace('[ ] README / runtime config docs aligned', '[x] README / runtime config docs aligned')
              text = text.replace('[ ] no accidental cross-layer dependency', '[x] no accidental cross-layer dependency')
              path.write_text(text)
          PY

      - name: Remove release helpers
        run: |
          git rm --ignore-unmatch \
            .github/workflows/release-clippy-fix.yml \
            .github/workflows/release-finalize.yml \
            .github/workflows/release-cleanup.yml \
            .github/workflows/release-preclean.yml \
            .github/workflows/release-super-finalize.yml \
            .github/workflows/release-super-finalize-v2.yml \
            .github/workflows/release-finalize-v3.yml \
            .github/workflows/release-proof.yml \
            .github/workflows/release-hardening-format.yml \
            .github/workflows/release-lockfile.yml

      - name: Commit final source state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: verify v0.1 release source gate" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin feat/release-hardening || true
            if git push origin HEAD:feat/release-hardening; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Capture diagnostics
        if: failure()
        run: |
          set +e
          cargo fmt --all -- --check > release-finalize-v3.log 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings >> release-finalize-v3.log 2>&1
          cargo test --locked --all-features >> release-finalize-v3.log 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-finalize-v3-log
          path: release-finalize-v3.log
          if-no-files-found: error
          retention-days: 1
