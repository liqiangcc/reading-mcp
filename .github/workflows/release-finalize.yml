name: Release Finalize

on:
  push:
    branches:
      - feat/release-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply mechanical fixes
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all
          cargo clippy --fix --locked --allow-dirty --allow-staged --all-targets --all-features
          cargo fmt --all

      - name: Verify release gate
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

      - name: Finalize release-hardening branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/release-clippy-fix.yml
          git rm --ignore-unmatch .github/workflows/release-finalize.yml
          mkdir -p docs
          cat > docs/release-gate-status.md <<EOF
          # Release Gate Status

          The release-hardening finalizer passed on source commit \`${GITHUB_SHA}\`.

          Verified by GitHub Actions:

          - \`cargo fmt --all -- --check\`
          - \`cargo clippy --locked --all-targets --all-features -- -D warnings\`
          - \`cargo test --locked --all-features\`

          This marker records verification of the parent source tree. The resulting bot commit only contains mechanical rustfmt/Clippy fixes, removal of temporary release workflows, and this status document.
          EOF
          git add -- '*.rs' docs/release-gate-status.md
          if git diff --cached --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git commit -m "chore: finalize v0.1 release hardening"
          git push origin HEAD:feat/release-hardening

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          cargo fmt --all -- --check > release-finalize.log 2>&1 || true
          cargo clippy --locked --all-targets --all-features -- -D warnings >> release-finalize.log 2>&1 || true
          cargo test --locked --all-features >> release-finalize.log 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-finalize-log
          path: release-finalize.log
          if-no-files-found: error
          retention-days: 1
