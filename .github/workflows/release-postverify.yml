name: Release Post Verify

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - feat/release-hardening

permissions:
  contents: write

jobs:
  prove:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release branch
        uses: actions/checkout@v4
        with:
          ref: feat/release-hardening
          fetch-depth: 0

      - name: Require source-gate marker
        run: test -s docs/release-gate-status.md

      - name: Record normal CI proof
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > docs/release-ci-proof.md <<EOF
          # Release CI Proof

          Normal GitHub Actions \`CI\` completed successfully for \`feat/release-hardening\` after the source gate was recorded.

          - CI run ID: \`${RUN_ID}\`
          - CI head SHA: \`${HEAD_SHA}\`
          - CI run: ${RUN_URL}

          Normal CI enforces committed dependencies with \`--locked\` and runs format, Clippy with warnings denied, and the complete test suite.
          EOF
          git rm --ignore-unmatch \
            .github/workflows/release-postverify.yml \
            .github/workflows/release-clippy-fix.yml \
            .github/workflows/release-finalize.yml \
            .github/workflows/release-cleanup.yml \
            .github/workflows/release-preclean.yml \
            .github/workflows/release-super-finalize.yml \
            .github/workflows/release-super-finalize-v2.yml \
            .github/workflows/release-finalize-v3.yml \
            .github/workflows/release-proof.yml \
            .github/workflows/release-hardening-format.yml \
            .github/workflows/release-lockfile.yml
          git add docs/release-ci-proof.md
          git commit -m "chore: record v0.1 normal CI proof"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin feat/release-hardening || true
            if git push origin HEAD:feat/release-hardening; then
              exit 0
            fi
            sleep 2
          done
          exit 1
