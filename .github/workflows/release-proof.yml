name: Release CI Proof

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - feat/release-hardening

permissions:
  actions: read
  contents: write

jobs:
  prove:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: feat/release-hardening
          fetch-depth: 0

      - name: Require source gate marker
        run: test -s docs/release-gate-status.md

      - name: Record normal CI proof and clean helpers
        env:
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > docs/release-ci-proof.md <<EOF
          # Release CI Proof

          Normal GitHub Actions \`CI\` completed successfully for the release-hardening branch.

          - Run ID: \`${VERIFIED_RUN_ID}\`
          - Verified head SHA: \`${VERIFIED_HEAD_SHA}\`
          - Run: ${VERIFIED_RUN_URL}
          - Dependency mode: \`--locked\`

          The normal CI workflow verifies:

          - \`cargo fmt --all -- --check\`
          - \`cargo clippy --locked --all-targets --all-features -- -D warnings\`
          - \`cargo test --locked --all-features\`

          The test suite includes real stdio MCP subprocess flows, persistence/restart, conditional HTTP cache, authentication isolation, resource budgets, SQLite FTS, the MVP format acceptance matrix, and extended-format parser tests.
          EOF
          git rm --ignore-unmatch \
            .github/workflows/release-clippy-fix.yml \
            .github/workflows/release-finalize.yml \
            .github/workflows/release-cleanup.yml \
            .github/workflows/release-preclean.yml \
            .github/workflows/release-super-finalize.yml \
            .github/workflows/release-hardening-format.yml \
            .github/workflows/release-lockfile.yml \
            .github/workflows/release-proof.yml
          git add docs/release-ci-proof.md
          git commit -m "chore: record v0.1 release CI proof"
          git pull --rebase origin feat/release-hardening
          git push origin HEAD:feat/release-hardening
