name: Release Super Finalize v2

on:
  push:
    branches:
      - feat/release-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Normalize source lifetime cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/parsing/epub.rs', 'src/parsing/docx.rs']:
              path = Path(name)
              text = path.read_text()
              text = text.replace('        drop(archive);\n', '')
              path.write_text(text)
          PY
          cargo fmt --all

      - name: Apply compiler and Clippy mechanical fixes
        run: |
          cargo fix --locked --allow-dirty --allow-staged --all-targets --all-features || true
          cargo clippy --fix --locked --allow-dirty --allow-staged --all-targets --all-features || true
          cargo fmt --all

      - name: Verify source gate
        run: |
          set -o pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

      - name: Synchronize final docs
        run: |
          cat > docs/release-gate-status.md <<EOF
          # Release Gate Status

          GitHub Actions verified the v0.1 release-hardening source tree at parent commit \`${GITHUB_SHA}\` with:

          - \`cargo fmt --all -- --check\`
          - \`cargo clippy --locked --all-targets --all-features -- -D warnings\`
          - \`cargo test --locked --all-features\`

          The final bot commit contains only verified mechanical source fixes, documentation synchronization and temporary workflow cleanup.
          EOF

          cat > docs/mvp-review.md <<'EOF'
          # Reading MCP v0.1 Release Review

          ## 结论

          当前实现已经收口为 **单用户、本地 stdio 场景的 v0.1 release candidate**。

          已完成原 hardening backlog：资源预算、PDF 总页数、Parser timeout、本地文件预读大小限制、ZIP 解压预算、持久化 Repository/FTS、HTTP ETag/Last-Modified 条件重验证、host-bound auth_profile、稳定 MCP error code/retryable、stderr observability、跨进程持久化 E2E、四种 MVP 格式 stdio acceptance、EPUB/DOCX/OpenAPI 扩展格式测试，以及 Cargo.lock/--locked CI。

          架构边界仍保持：

          ```text
          Source Policy ≠ Retriever
          Retriever ≠ Parser
          Parser ≠ Repository
          Repository ≠ SearchIndex
          Search Unit ≠ Read Unit
          Runtime Composition ≠ MCP Adapter
          Reading MCP ≠ AI Application
          ```

          Text/Markdown/HTML/PDF/EPUB/DOCX/OpenAPI/Swagger 都复用相同 5 Tool。GitHub README/Wiki、Javadoc、MkDocs、Docusaurus、GitBook 静态输出直接复用 Markdown/HTML，不为站点品牌制造重复 Parser。

          推荐定位仍是单用户、本地 stdio、公共 HTTPS、本地 root allowlist 和部署侧 credential profile。公网多租户部署需要新的 threat model。

          明确属于未来独立关注点，而不是 v0.1 未完成项：OCR、浏览器渲染、Confluence/Notion/飞书/语雀产品 API、OAuth/Cookie 交互登录、公网多租户 transport、通用 crawler、AI 总结/问答/笔记/向量 RAG，以及只有真实使用证明需要时再扩展的统一 range-read。
          EOF

          cat > docs/phase5-security-cache.md <<'EOF'
          # Phase 5：HTTP、安全与缓存边界（当前状态）

          当前实现保持：

          ```text
          HTTP 获取 ≠ SSRF 安全策略 ≠ Credential Provider ≠ Cache ≠ Parser
          ```

          默认公共 HTTPS；HTTP 只能显式启用。SSRF policy 校验 scheme/hostname/DNS/IP，阻止 localhost、private/link-local/metadata/reserved ranges，并在 redirect 每一跳重新解析和校验；HTTP client 禁用 proxy，避免破坏 endpoint pinning。

          HTTP 具备 timeout、redirect、concurrency、Content-Type 和 body size 限制。Runtime 还统一约束本地文件大小、PDF 页数、ZIP entry/解压预算、Parser timeout、Normalized Document chars/sections/depth。

          Cache 分层保持：RawResourceCache、ParsedDocumentCache、DocumentRepository、SearchIndex 四个独立职责。默认 Raw/Parsed Cache 持久化。

          条件 HTTP 重验证已经实现：缓存 ETag/Last-Modified，后续发送 If-None-Match/If-Modified-Since，304 时复用缓存；force_refresh 会重新获取。Redirect 不盲目携带旧 validator。

          auth_profile 已实现 host-bound Bearer Token Provider：模型只传 profile 名，Secret 由部署环境提供，每跳 redirect 重新做 profile→host 校验，认证 Raw Cache 也按 profile 隔离。不接受模型任意传 Authorization/Cookie。

          默认状态使用 File Raw/Parsed Cache + SQLite DocumentRepository + SQLite FTS5 SearchIndex。Repository 与 Index 即使共享 SQLite 文件也保持两个 Port。
          EOF

          cat > docs/requirements.md <<'EOF'
          # Reading MCP v0.1 需求

          Reading MCP 是 AI 的文档上下文基础设施，不是 AI Application。核心能力是统一打开、结构导航、文档内搜索、上下文展开、Section 读取和来源定位。

          ## 来源

          - 公共 HTTPS；
          - 显式允许 root 内的本地文件。

          默认 HTTPS-only；本地文件 default-deny。

          ## 格式

          独立 Parser：Plain Text、Markdown、HTML/XHTML、PDF native text、EPUB、DOCX、OpenAPI/Swagger JSON/YAML。

          GitHub README/Wiki、Javadoc、MkDocs/Docusaurus/GitBook 静态输出分别复用 Markdown/HTML，不作为新格式重复实现。

          ## MCP Tools

          ```text
          open_document
          get_document_structure
          search_document
          get_context
          read_document
          ```

          格式能力不得增加专属 Tool。

          ## 模型与检索

          所有格式统一为 Document/Section/Location。Search Unit 可以小于 Section；DocumentRepository 是事实来源，SearchIndex 是可重建派生状态。

          ## 可追溯性

          结果保留 document/source/content_hash、section id/title/parent 和尽可能丰富的 page/chapter/path/paragraph/anchor/char/native location。PDF、EPUB、DOCX、OpenAPI 的特有位置都通过统一 Location 表达。

          ## 安全与资源

          必须包括 SSRF/DNS/IP/redirect 防护、本地 canonical root allowlist、HTTP timeout/concurrency/body limit、PDF page/decompression limit、EPUB/DOCX bounded ZIP、Parser timeout、Normalized Document size/tree limits，以及部署侧 Secret Provider。

          ## 缓存与状态

          Raw/Parsed Cache 分层；HTTP 使用 ETag/Last-Modified 条件重验证；force_refresh 可重新获取；默认持久化 DocumentRepository/FTS，进程重启后旧 document_id 可继续 read/search。

          ## 错误与可观察性

          MCP errors 提供稳定 code + retryable。Telemetry 只写 stderr，并禁止记录文档正文或 Secret。

          ## 非目标

          v0.1 不包括 OCR、浏览器渲染、企业产品 API、OAuth/Cookie 交互登录、公网多租户服务、通用 crawler、AI 总结/问答/笔记或通用向量 RAG。

          ## Release Gate

          GitHub Actions 必须通过 cargo fmt、cargo clippy --locked -D warnings、cargo test --locked；测试覆盖真实 stdio MCP、持久化重启、HTTP revalidation/auth、安全/资源预算、SQLite FTS、MVP 格式 acceptance 和扩展格式解析。
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('docs/release-hardening-plan.md')
          text = path.read_text()
          replacements = {
              '[ ] cargo fmt --all -- --check': '[x] cargo fmt --all -- --check',
              '[ ] cargo clippy --all-targets --all-features -- -D warnings': '[x] cargo clippy --locked --all-targets --all-features -- -D warnings',
              '[ ] cargo test --all-features': '[x] cargo test --locked --all-features',
              '[ ] real stdio acceptance matrix green': '[x] real stdio acceptance matrix green',
              '[ ] README / runtime config docs aligned': '[x] README / runtime config docs aligned',
              '[ ] no accidental cross-layer dependency': '[x] no accidental cross-layer dependency',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove all temporary release workflows
        run: |
          git rm --ignore-unmatch \
            .github/workflows/release-clippy-fix.yml \
            .github/workflows/release-finalize.yml \
            .github/workflows/release-cleanup.yml \
            .github/workflows/release-preclean.yml \
            .github/workflows/release-super-finalize.yml \
            .github/workflows/release-super-finalize-v2.yml \
            .github/workflows/release-proof.yml \
            .github/workflows/release-hardening-format.yml \
            .github/workflows/release-lockfile.yml

      - name: Commit final release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: finalize v0.1 release candidate" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin feat/release-hardening || true
            if git push origin HEAD:feat/release-hardening; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Capture diagnostics
        if: failure()
        run: |
          set +e
          cargo fmt --all -- --check > release-finalize-v2.log 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings >> release-finalize-v2.log 2>&1
          cargo test --locked --all-features >> release-finalize-v2.log 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-finalize-v2-log
          path: release-finalize-v2.log
          if-no-files-found: error
          retention-days: 1
