name: Release v0.2.0 version bump once

on:
  push:
    branches:
      - release/v0.2.0-version
    paths:
      - ".github/workflows/release-v0.2.0-version-bump.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release version branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.0-version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Bump source and runtime version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          old = 'name = "reading-mcp"\nversion = "0.1.0"'
          new = 'name = "reading-mcp"\nversion = "0.2.0"'
          if text.count(old) != 1:
              raise SystemExit("Cargo.toml reading-mcp 0.1.0 identity not found exactly once")
          cargo.write_text(text.replace(old, new, 1), encoding="utf-8")

          server = Path("src/mcp/server.rs")
          text = server.read_text(encoding="utf-8")
          old = 'name = "reading-mcp",\n    version = "0.1.0",'
          new = 'name = "reading-mcp",\n    version = "0.2.0",'
          if text.count(old) != 1:
              raise SystemExit("MCP runtime 0.1.0 identity not found exactly once")
          server.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          # Let Cargo update only the workspace/root package identity in Cargo.lock.
          cargo check --all-features
          cargo check --locked --all-features

      - name: Verify exact version identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          if not re.search(r'^version\s*=\s*"0\.2\.0"\s*$', cargo, re.MULTILINE):
              raise SystemExit("Cargo.toml is not 0.2.0")

          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          match = re.search(r'\[\[package\]\]\nname = "reading-mcp"\nversion = "([^"]+)"', lock)
          if not match or match.group(1) != "0.2.0":
              raise SystemExit(f"Cargo.lock reading-mcp version mismatch: {match.group(1) if match else 'missing'}")

          server = Path("src/mcp/server.rs").read_text(encoding="utf-8")
          if 'name = "reading-mcp",\n    version = "0.2.0",' not in server:
              raise SystemExit("runtime ServerHandler version is not 0.2.0")
          PY

          changed=$(git status --porcelain | awk '{print $2}' | sort)
          expected=$(printf '%s\n' Cargo.lock Cargo.toml src/mcp/server.rs | sort)
          test "$changed" = "$expected"

      - name: Commit clean release identity change and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v0.2.0-version-bump.yml
          git add Cargo.toml Cargo.lock src/mcp/server.rs
          git commit -m "chore: prepare v0.2.0 release identity"
          git push origin HEAD:release/v0.2.0-version
