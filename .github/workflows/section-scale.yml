name: Section scale

# The section tree as rows is only worth its bytes if it holds at scale, so this gate opens
# synthetic EPUBs whose section count is the variable (N = 500, 2,000, 8,000, 20,000, in a
# three-level nest and flat) and reports what one open costs: open seconds, state-directory bytes
# and the number of rows in `document_header_v1`, `document_sections_v1` and
# `document_body_order_rows_v1`. It also measures what one read costs (SEC-2, PREWARM-2): `v2 read`
# sentence steps, `get_text_units` and `get_context`, 200 calls each at 50% of the book, mean ms and
# rchar/call per N. The read gate is flatness: at N = 20,000 each tool's mean is at most 1.3x its
# N = 500 mean, its absolute mean is at most 5 ms, and rchar/call does not grow. It runs the read
# probe three ways: with the bounded warm on and the probe waiting for it to end (the gate: reads
# after the warm), with `READING_MCP_SEARCH_PREWARM_BUDGET_MS=0` (the gate: SEC-2's numbers), and
# with the warm on but the timed loop overlapping it (reported, not gated: rchar is non-flat there
# by design).
#
# `workflow_dispatch` only fires for a workflow that already exists on the default branch, so a
# `section-scale-*` push is how this gate runs on the branch that introduces it.
on:
  workflow_dispatch:
  push:
    branches: ['section-scale-*']

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release --locked --bin reading-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the many-section EPUBs
        run: |
          python3 scripts/gen-sections-epub.py \
            --out-dir "$RUNNER_TEMP/sections" \
            --sections 500 2000 8000 20000 \
            --layouts nested flat
      - name: Open each EPUB and dump the section-row facts
        run: |
          set -uo pipefail
          INPUTS="$RUNNER_TEMP/sections"
          mkdir -p scale
          args=(--binary target/release/reading-mcp --out-dir "$RUNNER_TEMP/scale-state")
          for sections in 500 2000 8000 20000; do
            for layout in nested flat; do
              args+=(--documents "sections-$layout-$sections=$INPUTS/sections-$layout-$sections.epub")
            done
          done
          python3 scripts/sqlite-facts.py "${args[@]}" 2>&1 | tee scale/facts.txt
      - name: Open-phase breakdown per N
        if: always()
        run: |
          set -uo pipefail
          INPUTS="$RUNNER_TEMP/sections"
          mkdir -p phases
          python3 scripts/memory-profile.py \
            --binary target/release/reading-mcp \
            --out phases/phases.json \
            --states dir \
            --telemetry \
            --documents "sections-nested-500=$INPUTS/sections-nested-500.epub,sections-nested-2000=$INPUTS/sections-nested-2000.epub,sections-nested-8000=$INPUTS/sections-nested-8000.epub,sections-nested-20000=$INPUTS/sections-nested-20000.epub" \
            2>&1 | tee phases/phases.txt || echo "::warning::the phase breakdown failed"
      - name: Measure the read tools at every N, with the warm on, off and unwaited
        if: always()
        run: |
          set -uo pipefail
          INPUTS="$RUNNER_TEMP/sections"
          mkdir -p read-measure
          # warm: the gate. The probe waits for the bounded warm to end before the timed loop, so
          # the per-call rchar measures the read path and not the warm; the wait is reported.
          # warm-off: READING_MCP_SEARCH_PREWARM_BUDGET_MS=0, which must reproduce SEC-2's numbers.
          # warm-nowait: warm on and the timed loop overlaps it, reported but not gated: it is the
          # honest "rchar while the warm runs" number.
          for sections in 500 2000 8000 20000; do
            for layout in nested flat; do
              label="sections-$layout-$sections"
              for side in warm warm-off warm-nowait; do
                extra=()
                case "$side" in
                  warm) extra=(--wait-for-warm) ;;
                  warm-off) extra=(--env READING_MCP_SEARCH_PREWARM_BUDGET_MS=0) ;;
                esac
                python3 scripts/doc-read-probe.py \
                  --binary target/release/reading-mcp \
                  --document "$INPUTS/$label.epub" \
                  --label "$label" \
                  --side "$side" \
                  --calls 200 \
                  --start-fraction 0.5 \
                  --io-bytes \
                  --env READING_MCP_TOOLS=both \
                  "${extra[@]}" \
                  --out "read-measure/$label-$side.json" \
                  || echo "::warning::read probe failed: $label $side"
              done
            done
          done
      - name: Read scale table and flatness gate
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          TOOLS = ("v2_read", "get_text_units", "get_context")
          # The warm and warm-off sides are gated; warm-nowait is reported only, because the warm
          # runs inside those timed calls by design and rchar is expected to be non-flat there.
          GATED_SIDES = ("warm", "warm-off")
          REPORT_SIDES = ("warm-nowait",)
          SIDES = GATED_SIDES + REPORT_SIDES
          results = {}
          for path in sorted(glob.glob("read-measure/*.json")):
              with open(path, encoding="utf-8") as handle:
                  result = json.load(handle)
              results[(result["label"], result["side"])] = result

          def warm_wait(result):
              for item in result.get("warm_waits") or []:
                  if item.get("after") == "open_document":
                      return item
              return None

          def label_key(label):
              parts = label.split("-")
              return (parts[1], int(parts[-1]))

          lines = [
              "| input | side | layout | sections | tool | calls | mean ms | median ms | p95 ms "
              "| rchar/call | warm wait s | warm timed out | warm sections | warm rows |",
              "|---|---|---|---:|---|---:|---:|---:|---:|---:|---|---:|---:|",
          ]
          for label in sorted({label for label, _ in results}, key=label_key):
              parts = label.split("-")
              layout = parts[1]
              sections = parts[-1]
              for side in SIDES:
                  result = results.get((label, side))
                  if result is None:
                      continue
                  wait = warm_wait(result)
                  event = (wait or {}).get("event") or {}
                  for tool in TOOLS:
                      summary = result.get("shapes", {}).get(tool)
                      if summary is None:
                          lines.append(
                              f"| {label} | {side} | {layout} | {sections} | {tool} "
                              "| - | - | - | - | - | - | - | - | - |"
                          )
                          continue
                      lines.append(
                          "| {label} | {side} | {layout} | {sections} | {tool} | {calls} "
                          "| {mean:.3f} | {median:.3f} | {p95:.3f} | {rchar:.0f} "
                          "| {wait} | {timed_out} | {warm_sections} | {warm_rows} |".format(
                              label=label,
                              side=side,
                              layout=layout,
                              sections=sections,
                              tool=tool,
                              calls=result.get("calls", "-"),
                              mean=summary.get("mean_ms", 0.0),
                              median=summary.get("median_ms", 0.0),
                              p95=summary.get("p95_ms", 0.0),
                              rchar=summary.get("io_rchar_mean", 0.0),
                              wait="-" if wait is None else wait.get("seconds"),
                              timed_out="-" if wait is None else wait.get("timed_out"),
                              warm_sections=event.get("sections", "-"),
                              warm_rows=event.get("rows_read", "-"),
                          )
                      )
          table = "\n".join(lines) + "\n"
          with open("read-measure/table.md", "w", encoding="utf-8") as handle:
              handle.write(table)
          print(table)

          failures = []
          for side in SIDES:
              for layout in ("nested", "flat"):
                  small = results.get((f"sections-{layout}-500", side))
                  large = results.get((f"sections-{layout}-20000", side))
                  if small is None or large is None:
                      if side in GATED_SIDES:
                          failures.append(
                              f"{side}/{layout}: missing the N=500 or N=20000 probe"
                          )
                      continue
                  if side in GATED_SIDES:
                      wait = warm_wait(large)
                      if side == "warm" and wait is not None and wait.get("timed_out"):
                          failures.append(
                              f"{side}/{layout}: the probe gave up waiting for the warm after "
                              f"{wait.get('seconds')} s, so its per-call rchar is not the read path"
                          )
                  for tool in TOOLS:
                      small_summary = small.get("shapes", {}).get(tool)
                      large_summary = large.get("shapes", {}).get(tool)
                      if small_summary is None or large_summary is None:
                          if side in GATED_SIDES:
                              failures.append(f"{side}/{layout}/{tool}: no measurement")
                          continue
                      small_ms = small_summary.get("mean_ms", 0.0)
                      large_ms = large_summary.get("mean_ms", 0.0)
                      ratio = large_ms / small_ms if small_ms > 0 else float("inf")
                      small_rchar = small_summary.get("io_rchar_mean", 0.0)
                      large_rchar = large_summary.get("io_rchar_mean", 0.0)
                      rchar_ratio = (
                          large_rchar / small_rchar if small_rchar > 0 else float("inf")
                      )
                      gate = "gated" if side in GATED_SIDES else "reported"
                      print(
                          f"{side}/{layout}/{tool} ({gate}): mean_ms 500={small_ms:.3f} "
                          f"20000={large_ms:.3f} flatness={ratio:.2f} rchar/call "
                          f"500={small_rchar:.0f} 20000={large_rchar:.0f} "
                          f"rchar_flatness={rchar_ratio:.2f}"
                      )
                      if side not in GATED_SIDES:
                          continue
                      if ratio > 1.3:
                          failures.append(
                              f"{side}/{layout}/{tool}: N=20000 mean {large_ms:.3f} ms is "
                              f"{ratio:.2f}x the N=500 mean {small_ms:.3f} ms (gate 1.3x)"
                          )
                      if large_ms > 5.0:
                          failures.append(
                              f"{side}/{layout}/{tool}: N=20000 mean {large_ms:.3f} ms exceeds 5 ms"
                          )
                      if rchar_ratio > 1.3:
                          failures.append(
                              f"{side}/{layout}/{tool}: rchar/call grew {rchar_ratio:.2f}x from "
                              f"N=500 to N=20000"
                          )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(table)
          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          PY
      - name: Section scale table
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re

          FIELDS = re.compile(r"(\w+)=(\S+)")
          rows = []
          if os.path.isfile("scale/facts.txt"):
              with open("scale/facts.txt", encoding="utf-8") as handle:
                  for line in handle:
                      fields = dict(FIELDS.findall(line))
                      if fields.get("input"):
                          rows.append(fields)
          lines = [
              "| input | layout | sections | open s | peak RSS KiB | state bytes | header rows "
              "| section rows | body order rows | section row bytes |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for fields in rows:
              label = fields["input"]
              parts = label.split("-")
              layout = parts[1] if len(parts) > 1 else "-"
              sections = parts[-1]
              lines.append(
                  "| {label} | {layout} | {sections} | {open_s} | {rss} | {bytes} | {hr} | {sr} | "
                  "{br} | {sb} |".format(
                      label=label,
                      layout=layout,
                      sections=sections,
                      open_s=fields.get("open_seconds", "-"),
                      rss=fields.get("peak_rss_kib", "-"),
                      bytes=fields.get("sqlite_file_bytes", "-"),
                      hr=fields.get("document_header_v1_rows", "-"),
                      sr=fields.get("document_sections_v1_rows", "-"),
                      br=fields.get("document_body_order_rows_v1_rows", "-"),
                      sb=fields.get("document_sections_v1_bytes", "-"),
                  )
              )
          table = "\n".join(lines) + "\n"
          with open("scale/table.md", "w", encoding="utf-8") as handle:
              handle.write(table)
          print(table)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(table)
          PY
      - name: Upload scale data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-scale
          path: |
            scale/
            read-measure/
            phases/
