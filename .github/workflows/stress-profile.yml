name: Stress profile
on:
  workflow_dispatch:
  push:
    branches: ['bench/s-**']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary with line tables
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release --locked --bin reading-mcp
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stress-bin
          path: target/release/reading-mcp

  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tooling
        run: pip install pymupdf fonttools
      - name: Download public-domain books
        run: |
          STRESS="$RUNNER_TEMP/stress"
          mkdir -p "$STRESS"
          download() {
            local url="$1" out="$2"
            if curl -fsSL --retry 3 -o "$out" "$url"; then
              echo "$out: $(stat -c%s "$out") bytes sha256=$(sha256sum "$out" | cut -d' ' -f1)"
            else
              echo "::warning::failed to download $url"
              rm -f "$out"
            fi
            return 0
          }
          download "https://www.gutenberg.org/cache/epub/24183/pg24183-images.epub" "$STRESS/song-shi.epub"
          download "https://www.gutenberg.org/cache/epub/2600/pg2600.txt" "$STRESS/war-and-peace.txt"
          download "https://www.gutenberg.org/cache/epub/2600/pg2600-images.epub" "$STRESS/en-novel.epub"
          download "https://www.gutenberg.org/cache/epub/24264/pg24264-images.epub" "$STRESS/zh-classic.epub"
      - name: Generate stress inputs
        run: |
          STRESS="$RUNNER_TEMP/stress"
          args=(--out "$STRESS")
          [ -f "$STRESS/war-and-peace.txt" ] && args+=(--war-and-peace "$STRESS/war-and-peace.txt")
          [ -f "$STRESS/song-shi.epub" ] && args+=(--song-shi "$STRESS/song-shi.epub")
          python3 scripts/gen-stress-inputs.py "${args[@]}" | tee "$STRESS/manifest.json"
          ls -l "$STRESS"
      - name: Upload stress inputs
        uses: actions/upload-artifact@v4
        with:
          name: stress-inputs
          path: ${{ runner.temp }}/stress
          retention-days: 7

  probe:
    needs: [build, inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stress-bin
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v4
        with:
          name: stress-inputs
          path: ${{ runner.temp }}/stress
      - name: Big opens, memory caps, concurrency and deep paging
        run: |
          chmod +x "$RUNNER_TEMP/bin/reading-mcp"
          S="$RUNNER_TEMP/stress"
          python3 scripts/stress-probe.py --mode probe \
            --binary "$RUNNER_TEMP/bin/reading-mcp" \
            --state-root "$RUNNER_TEMP/state-probe" \
            --out "$RUNNER_TEMP/probe.json" \
            --caps --deadline-minutes 140 \
            --input "en-novel=$S/en-novel.epub" \
            --input "zh-classic=$S/zh-classic.epub" \
            --input "zh-large=$S/song-shi.epub" \
            --input "cjk-16mib=$S/cjk-16mib.txt" \
            --input "cjk-64mib=$S/cjk-64mib.txt" \
            --input "en-64mib=$S/en-64mib.txt" \
            --input "pdf-text-1500p=$S/pdf-text-1500p.pdf" \
            --input "pdf-text-cjk-1000p=$S/pdf-text-cjk-1000p.pdf" \
            --input "pdf-scan-300p=$S/pdf-scan-300p.pdf" \
            | tee "$RUNNER_TEMP/tables-1-3.md"
          cat "$RUNNER_TEMP/tables-1-3.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-probe
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: warn

  read:
    needs: [build, inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: en-novel, file: en-novel.epub, shard: 0, shards: 1}
          - {label: zh-classic, file: zh-classic.epub, shard: 0, shards: 1}
          - {label: pdf-text-1500p, file: pdf-text-1500p.pdf, shard: 0, shards: 1}
          - {label: zh-large, file: song-shi.epub, shard: 0, shards: 4}
          - {label: zh-large, file: song-shi.epub, shard: 1, shards: 4}
          - {label: zh-large, file: song-shi.epub, shard: 2, shards: 4}
          - {label: zh-large, file: song-shi.epub, shard: 3, shards: 4}
    name: read ${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stress-bin
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v4
        with:
          name: stress-inputs
          path: ${{ runner.temp }}/stress
      - name: Read the book sentence by sentence (shard)
        run: |
          chmod +x "$RUNNER_TEMP/bin/reading-mcp"
          mkdir -p "$RUNNER_TEMP/shards"
          python3 scripts/stress-probe.py --mode read \
            --binary "$RUNNER_TEMP/bin/reading-mcp" \
            --state-root "$RUNNER_TEMP/state-read" \
            --label "${{ matrix.label }}" \
            --source "$RUNNER_TEMP/stress/${{ matrix.file }}" \
            --shard "${{ matrix.shard }}" --shards "${{ matrix.shards }}" \
            --deadline-minutes 300 \
            --out "$RUNNER_TEMP/shards/shard-${{ matrix.label }}-${{ matrix.shard }}.json"
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.label }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: warn

  aggregate:
    needs: [read]
    if: always() && needs.read.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Table 4, full-book sentence-by-sentence read
        run: |
          python3 scripts/stress-probe.py --mode aggregate \
            --shards-dir "$RUNNER_TEMP/shards" \
            --out "$RUNNER_TEMP/table4.json" | tee "$RUNNER_TEMP/table4.md"
          cat "$RUNNER_TEMP/table4.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: stress-aggregate
          path: ${{ runner.temp }}/table4.json
