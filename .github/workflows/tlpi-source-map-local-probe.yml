name: TLPI source map local Reading MCP probe

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/tlpi_source_map_probe.rs
      - .github/workflows/tlpi-source-map-local-probe.yml

permissions:
  contents: read

jobs:
  local-reading-probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      TLPI_READING_STATE_DIR: /root/.reading-mcp
      TLPI_READING_LOCAL_ROOTS: /root
      READING_MCP_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Call persisted TLPI through Reading MCP stdio tools
        shell: bash
        run: cargo test --locked --test tlpi_source_map_probe -- --nocapture

      - name: Upload sanitized TLPI source map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlpi-source-map-local-reading-mcp
          path: tlpi-source-map-probe.json
          retention-days: 1
          if-no-files-found: error
