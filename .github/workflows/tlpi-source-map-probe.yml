name: TLPI source map through Responses MCP

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/tlpi_responses_probe.py
      - .github/workflows/tlpi-source-map-probe.yml

permissions:
  contents: read

jobs:
  responses-reading-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTROL_PLANE_API_KEY: ${{ secrets.CONTROL_PLANE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Call the deployed Reading MCP through Responses API
        shell: bash
        run: python3 scripts/tlpi_responses_probe.py

      - name: Upload sanitized TLPI source map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlpi-source-map-responses-reading-mcp
          path: tlpi-responses-probe.json
          retention-days: 1
          if-no-files-found: error
