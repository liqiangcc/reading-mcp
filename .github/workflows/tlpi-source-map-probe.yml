name: Build Reading MCP source-probe binary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tlpi-source-map-probe.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the current mainline Reading MCP binary
        shell: bash
        run: cargo build --release --locked --bin reading-mcp

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: reading-mcp-linux-amd64
          path: target/release/reading-mcp
          retention-days: 1
          if-no-files-found: error
