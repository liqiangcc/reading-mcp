name: Build Reading MCP source-probe bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tlpi-source-map-probe.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the current mainline Reading MCP binary
        shell: bash
        run: cargo build --release --locked --bin reading-mcp

      - name: Download official TLPI structural sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-probe
          curl --fail --location --silent --show-error \
            https://man7.org/tlpi/toc-detailed.html \
            --output source-probe/tlpi-toc-detailed.html
          curl --fail --location --silent --show-error \
            https://man7.org/tlpi/download/TLPI-00-Preface.pdf \
            --output source-probe/TLPI-00-Preface.pdf
          curl --fail --location --silent --show-error \
            https://man7.org/tlpi/download/TLPI-TOC-detailed.pdf \
            --output source-probe/TLPI-TOC-detailed.pdf
          cp target/release/reading-mcp source-probe/reading-mcp
          sha256sum source-probe/* > source-probe/SHA256SUMS

      - name: Upload source-probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: reading-mcp-tlpi-source-probe-bundle
          path: source-probe/
          retention-days: 1
          if-no-files-found: error
