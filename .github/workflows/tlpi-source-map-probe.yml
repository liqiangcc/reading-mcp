name: TLPI source map read-only probe

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/tlpi_source_probe.py
      - .github/workflows/tlpi-source-map-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_PLANE_API_KEY: ${{ secrets.CONTROL_PLANE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run sanitized read-only probe
        shell: bash
        run: python3 scripts/tlpi_source_probe.py

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlpi-source-map-probe
          path: tlpi-probe.json
          retention-days: 1
          if-no-files-found: error
