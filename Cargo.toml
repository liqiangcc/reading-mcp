[package]
name = "reading-mcp"
version = "0.1.0"
edition = "2024"
description = "Document and book reading context infrastructure for MCP"
license = "MIT"

[lib]
name = "reading_mcp"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
