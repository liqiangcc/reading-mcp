[package]
name = "reading-mcp"
version = "0.1.0"
edition = "2024"
description = "Document and book reading context infrastructure for MCP"
license = "MIT"

[lib]
name = "reading_mcp"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
lopdf = { version = "0.44", default-features = false }
markup5ever = "0.39"
schemars = "1"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
